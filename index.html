<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<title>竞彩记账看板 v2</title>
<style>
/* ===== 竞彩记账看板 v2 · 深色移动优先 ===== */
:root{
  --bg:#0f172a; --card:#1e293b; --line:#334155;
  --txt:#e2e8f0; --mut:#94a3b8;
  --gold:#eab308; --red:#ff0000; --amber:#f59e0b; --blue:#3b82f6; --ok:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.45;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--txt);background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
.pos{color:var(--gold)} .neg{color:var(--red)}
.mut{color:var(--mut)}
.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:var(--amber);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:6px}
.empty{color:var(--mut);text-align:center;padding:22px 10px;font-size:14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--mut)}
.big-btn{min-height:54px;border-radius:14px;font-size:18px;font-weight:700;width:100%;color:#fff}
.big-btn.gold{background:linear-gradient(180deg,#fbbf24,#d97706);color:#111;box-shadow:0 4px 14px rgba(234,179,8,.3)}
.big-btn.green{background:linear-gradient(180deg,#22c55e,#15803d);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.big-btn.gold:disabled,.big-btn.green:disabled{opacity:.45;box-shadow:none}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;min-height:42px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
/* 顶栏 */
header{position:sticky;top:0;z-index:60;height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;background:rgba(15,23,42,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tt{font-size:16px;font-weight:800}
.ver{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:2px}
.h-right{display:flex;align-items:center;gap:8px}
#clock{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
#syncIcon{font-size:18px;background:var(--card);border-radius:10px;padding:5px 8px;cursor:pointer}
/* 两大按钮(置顶常驻) */
.actions{position:sticky;top:52px;z-index:55;display:flex;gap:10px;padding:10px 14px;background:rgba(15,23,42,.95);backdrop-filter:blur(6px)}
/* 主内容 */
main{max-width:820px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat .lab{font-size:12px;color:var(--mut)}
.stat .val{font-size:23px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-all}
.stat .sub{font-size:11px;color:var(--mut);margin-top:2px}
.sec-title{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;margin-bottom:8px}
/* 今日比赛 */
.lg-group{margin-bottom:10px}
.lg-name{font-size:13px;color:var(--mut);padding:4px 2px}
.m-row{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.m-row.sel{border-color:var(--gold);background:#1c2434}
.m-row .kt{color:var(--mut);font-size:12px;min-width:40px}
.m-row .teams{flex:1;font-size:14px;min-width:0}
.m-row .teams b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{color:var(--mut);margin:0 4px;font-size:12px}
.m-row .sc{font-weight:800;color:var(--gold);font-size:14px}
.sel-mark{color:var(--gold);font-weight:800}
.st-badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--mut);flex:0 0 auto}
.st-badge.fin{background:rgba(255,0,0,.13);color:#f87171}
.st-badge.in{background:rgba(34,197,94,.13);color:var(--ok)}
/* 流水 */
.g-head{font-size:13px;color:var(--mut);padding:10px 2px 6px}
.ticket{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;border-left:4px solid var(--amber)}
.ticket.win{border-left-color:var(--gold)}
.ticket.lose{border-left-color:var(--red)}
.t-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.t-type{background:var(--blue);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;flex:0 0 auto}
.t-badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;flex:0 0 auto}
.t-badge.win{background:rgba(234,179,8,.16);color:var(--gold)}
.t-badge.lose{background:rgba(255,0,0,.16);color:#f87171}
.t-badge.pend{background:rgba(245,158,11,.16);color:var(--amber)}
.t-expect{margin-left:auto;font-size:12px;color:var(--mut);text-align:right}
.chev{color:var(--mut);font-size:11px}
.t-detail{display:none;border-top:1px solid var(--line);padding:10px 14px}
.ticket.open .t-detail{display:block}
.md{padding:10px 0;border-bottom:1px dashed var(--line)}
.md:last-child{border-bottom:0}
.md-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lg-tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.md-pick{font-size:13px;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.po{background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.po.hit{border-color:var(--gold);color:var(--gold);font-weight:700}
.res{font-size:12px;font-weight:700}
.res.win{color:var(--gold)} .res.lose{color:var(--red)} .res.pend{color:var(--amber)}
.md-score{font-size:12px;color:var(--mut);margin-top:2px}
.ctrl{display:flex;gap:8px;margin-top:8px}
.ctrl button{flex:1;min-height:40px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:#0b1220;color:var(--mut)}
.ctrl button.on-w{background:rgba(234,179,8,.15);border-color:var(--gold);color:var(--gold);font-weight:700}
.ctrl button.on-l{background:rgba(255,0,0,.15);border-color:var(--red);color:#f87171;font-weight:700}
.ctrl button.on-p{background:rgba(245,158,11,.15);border-color:var(--amber);color:var(--amber);font-weight:700}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding-top:10px;color:var(--mut)}
.t-foot b{font-size:14px}
/* 统计 */
details#more{background:var(--card);border-radius:14px;padding:12px 14px}
details#more summary{cursor:pointer;font-weight:700;padding:4px 0}
.row2{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.sub-t{font-size:13px;color:var(--mut);margin-top:12px;padding-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px}
.bar{flex:1;min-width:5px;background:var(--gold);border-radius:3px 3px 0 0;opacity:.9}
.bar.loss{background:var(--red)}
.bar.zero{background:var(--line)}
.bar-labels{display:flex;margin-top:4px}
.bar-labels span{flex:1;text-align:center;font-size:9px;color:var(--mut);overflow:hidden;white-space:nowrap}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btns .btn,.modal-btns .big-btn{flex:1}
/* 抽屉 */
#drawerBg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
#drawerBg.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#0b1220;border-radius:18px 18px 0 0;border-top:1px solid var(--line);max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
#drawer.open{transform:none}
#drawerHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px;flex:0 0 auto}
#drawerBody{overflow-y:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.step-t{font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 6px}
.lg-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.lg-chips::-webkit-scrollbar{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;min-height:38px;flex:0 0 auto}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.sel-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sel-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.odds-row{display:flex;gap:8px;margin-top:8px}
.odds-row .o-field{flex:1}
.odds-row label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.mu{display:flex;align-items:center;gap:10px}
.mu button{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
#multiVal{min-width:24px;text-align:center;font-size:16px}
.man-form input,.man-form select{margin-top:6px}
/* 弹窗 */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:20px}
#modal.show{display:flex}
#modalCard{background:var(--card);border-radius:16px;max-width:440px;width:100%;max-height:82vh;overflow:auto;padding:18px}
#modalCard h3{margin-bottom:10px;font-size:17px}
#modalCard p{font-size:14px;margin:6px 0}
.auto-list{max-height:40vh;overflow:auto;margin-top:8px}
.auto-item{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.hit-opts{display:flex;gap:8px;margin-top:10px}
.hit-opts .chip{flex:1;text-align:center}
/* 提示 */
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#111827;border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:820px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .actions{max-width:820px;margin:0 auto;left:0;right:0}
  #drawer{max-width:640px;margin:0 auto}
}
</style>
</head>
<body>
<header>
  <div class="tt">⚽ 竞彩记账看板 <span class="ver">v2</span></div>
  <div class="h-right"><span id="clock"></span><span id="syncIcon" title="同步状态">⚪</span></div>
</header>

<div class="actions">
  <button class="big-btn gold" data-act="new">➕ 记一注</button>
  <button class="big-btn green" data-act="auto">⚡ 自动结算</button>
</div>

<main>
  <section class="stats">
    <div class="stat" id="statCapital"></div>
    <div class="stat" id="statAvail"></div>
    <div class="stat" id="statPnl"></div>
    <div class="stat" id="statToday"></div>
  </section>

  <section id="matchSec">
    <div class="sec-title">⚽ 今日比赛 <button class="mini" data-act="reloadMatches" title="刷新">↻</button></div>
    <div id="matchList"></div>
  </section>

  <section>
    <div class="sec-title">🧾 投注流水</div>
    <div id="stream"></div>
  </section>

  <details id="more">
    <summary>📊 统计与数据</summary>
    <div class="row2"><span>ROI(累计盈亏 / 总投入)</span><b id="roiVal">—</b></div>
    <div class="row2"><span>串关命中率(中奖票 / 已结算)</span><b id="comboVal">—</b></div>
    <div class="row2"><span>单场命中率(命中场 / 已定场)</span><b id="singleVal">—</b></div>
    <div class="row2"><span>累计投入</span><b id="stakeVal">—</b></div>
    <div class="row2"><span>已结算 / 中奖</span><b id="countVal">—</b></div>
    <div class="sub-t">📈 近 14 天盈亏走势</div>
    <div id="trend"></div>
    <div class="modal-btns" style="margin-top:12px">
      <button class="btn" data-act="export">📤 导出 JSON</button>
      <button class="btn" data-act="import">📥 导入旧数据</button>
    </div>
  </details>
</main>

<div id="drawerBg"></div>
<div id="drawer">
  <div id="drawerHead"><span id="drawerTitle">➕ 记一注</span><button data-act="drawerClose" style="font-size:18px;padding:4px 8px">✕</button></div>
  <div id="drawerBody">
    <div class="step-t">① 选比赛(今天+明天)</div>
    <div class="lg-chips" id="lgChips"></div>
    <div id="pickSec"><div id="pickList"></div></div>

    <div class="step-t">② 定赛果(每场选 胜/平/负,可双选)</div>
    <div id="selCards"></div>

    <div class="step-t">③ 投注</div>
    <div class="row2"><span>串关类型</span><b id="cType">—</b></div>
    <div class="row2"><span>倍数</span><span class="mu"><button data-act="mu" data-d="-1">−</button><b id="multiVal">1</b><button data-act="mu" data-d="1">+</button></span></div>
    <div class="row2"><span>投入金额(元)</span><input id="stakeInput" type="number" min="2" step="1" inputmode="decimal" style="width:120px;text-align:right"></div>
    <div class="mut" style="font-size:12px">自动 = 2元 × 场次 × 倍数,可修改</div>
    <div class="modal-btns" style="margin-top:12px">
      <button class="btn" data-act="more">➕ 再加一场</button>
      <button class="big-btn gold" id="btnSave" data-act="save">💾 保存</button>
    </div>
  </div>
</div>

<div id="modal"><div id="modalCard"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 竞彩记账看板 v2 =================
 * 本地 localStorage 为主,云同步(GitHub Contents API)全自动
 * 比赛数据:启动拉取 matches.json(api.github.com 优先,raw 兜底),≥5分钟刷新
 * 结算:组合拆解(双选拆组合),组合赔率连乘×2元×倍数,命中组合返奖相加
 * ==================================================== */
const REPO='7velo/football-dash';
const LS_DATA='fd_data_v2', LS_TOKEN='gh_sync_token', LS_DIRTY='fd_dirty';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney=v=>{const n=+v||0;return (Math.round(n*100)/100).toFixed(2);};
const pct=v=>(v*100).toFixed(1)+'%';
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));

/* ---------- 北京时间 ---------- */
const beijingFmt=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function beijingParts(){const o={};beijingFmt.formatToParts(new Date()).forEach(p=>{if(p.type!=='literal')o[p.type]=p.value;});return o;}
function beijingDateStr(){const p=beijingParts();return p.year+'-'+p.month+'-'+p.day;}
function beijingDateStrOffset(n){const p=beijingParts();const d=new Date(+p.year,+p.month-1,+p.day+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function beijingClock(){const p=beijingParts();return p.hour+':'+p.minute+':'+p.second;}
function fmtDateCN(d){if(!d)return '';const [y,m,dd]=d.split('-').map(Number);const wd=['周日','周一','周二','周三','周四','周五','周六'][new Date(y,m-1,dd).getDay()];return d+' '+wd;}

/* ---------- 数据 ---------- */
let data={capital:500,tickets:[],lastModified:0};
let matchesData=null;      // matches.json 内容
let syncState='none';      // none/syncing/synced/error
let dirty=false;           // 有待推送的本地改动
function loadLocal(){try{const raw=localStorage.getItem(LS_DATA);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.tickets))data=d;}}catch(e){}}
function saveLocal(){data.lastModified=Date.now();try{localStorage.setItem(LS_DATA,JSON.stringify(data));}catch(e){}}
function afterChange(){saveLocal();markDirty();renderAll();}
function nextId(){return data.tickets.reduce((a,t)=>Math.max(a,t.id||0),0)+1;}

/* ---------- 赔率与组合拆解(核心计算,与旧版一致) ---------- */
// pick 可含"或"=双选;odds 为数字(单选)或 "2.1,3.0"(双选,与选项顺序对应)
function pickOptions(m){return String(m.pick||'').split(/或/).map(s=>s.trim()).filter(Boolean);}
function isDouble(m){return pickOptions(m).length>1;}
function parseOdds(m){
  if(typeof m.odds==='number')return [m.odds];
  return String(m.odds??'').split(/[,，/|]/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
}
function optionOdds(m,opt){const po=pickOptions(m),o=parseOdds(m),i=po.indexOf(opt);return (i>=0&&o[i]!=null)?o[i]:(o[0]||0);}
// 整单是否已结算:全部场次已定,且双选命中项已确认
function ticketSettled(t){
  if(!t||!Array.isArray(t.matches)||!t.matches.length)return false;
  return t.matches.every(m=>{
    if(!m.result||m.result==='pending')return false;
    if(m.result==='win'&&isDouble(m)&&!m.hit)return false;
    return true;
  });
}
// 组合枚举:每场取命中选项(已定)或全部选项(未定);任一场错 → 无命中组合
function combos(t){
  const opts=(t.matches||[]).map(m=>{
    if(m.result==='lose')return [];
    if(m.result==='win')return [m.hit||pickOptions(m)[0]];
    return pickOptions(m);
  });
  let acc=[[]];
  for(const o of opts){if(!o.length)return [];acc=acc.flatMap(a=>o.map(x=>[...a,x]));}
  return acc;
}
function comboOdds(t,c){let p=1;t.matches.forEach((m,i)=>{p*=optionOdds(m,c[i])||1;});return p;}
// 返奖 = 命中组合赔率连乘 × 2元 × 倍数,相加
function ticketReturn(t){
  if(!ticketSettled(t))return 0;
  return Math.round(combos(t).reduce((s,c)=>s+comboOdds(t,c)*2*(t.multi||1),0)*100)/100;
}
// 待赛单预计区间:已中场用实际赔率;未定场取最低(保守)/最高(乐观)赔率 ×2×倍数
function ticketRange(t){
  if(ticketSettled(t)){const r=ticketReturn(t);return{low:r,high:r,settled:true};}
  if((t.matches||[]).some(m=>m.result==='lose'))return{low:0,high:0,settled:false};
  let lo=1,hi=1;
  for(const m of (t.matches||[])){
    if(m.result==='win'){const o=optionOdds(m,m.hit||pickOptions(m)[0])||1;lo*=o;hi*=o;}
    else{const os=pickOptions(m).map(o=>optionOdds(m,o)).filter(v=>v>0);const mn=os.length?Math.min(...os):1,mx=os.length?Math.max(...os):1;lo*=mn;hi*=mx;}
  }
  return{low:Math.round(lo*2*(t.multi||1)*100)/100,high:Math.round(hi*2*(t.multi||1)*100)/100,settled:false};
}
/* ---------- 统计 ---------- */
function stats(){
  let totalStake=0,returns=0,settled=0,wins=0,hitM=0,decM=0,pendingCount=0;
  const today=beijingDateStr();let todayPnl=0,todayWins=0,todayLosses=0;
  for(const t of data.tickets){
    const st=t.stake||0;totalStake+=st;
    for(const m of (t.matches||[])){if(m.result&&m.result!=='pending'){decM++;if(m.result==='win')hitM++;}}
    if(ticketSettled(t)){settled++;const r=ticketReturn(t);returns+=r;if(r>0)wins++;}else pendingCount++;
    if(t.date===today){const r=ticketSettled(t)?ticketReturn(t):0;todayPnl+=r-st;if(ticketSettled(t)){if(r>0)todayWins++;else todayLosses++;}}
  }
  const pnl=returns-totalStake;
  return{totalStake,pnl,available:data.capital+pnl,settled,wins,hitM,decM,pendingCount,todayPnl,todayWins,todayLosses,
    roi:totalStake?pnl/totalStake:0,comboRate:settled?wins/settled:0,singleRate:decM?hitM/decM:0};
}
/* ---------- 比赛数据(matches.json) ---------- */
let lastMatchFetch=0;
async function loadMatches(force){
  const now=Date.now();
  if(!force&&now-lastMatchFetch<300000)return; // 拉取间隔 ≥5分钟
  lastMatchFetch=now;
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/matches.json',{cache:'no-store'});
    if(r.ok){matchesData=JSON.parse(b64d((await r.json()).content));}
    else throw new Error('api '+r.status);
  }catch(e){
    try{
      const r2=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/matches.json?t='+now,{cache:'no-store'});
      if(r2.ok)matchesData=await r2.json();else throw new Error('raw '+r2.status);
    }catch(e2){matchesData=null;} // 失败静默,今日比赛卡隐藏
  }
  renderAll();
}
function normEq(a,b){const n=s=>String(s||'').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g,'');return n(a)&&n(a)===n(b);}
// 关联比赛:优先 matchId,兜底主客队名
function findMatch(m){
  if(!matchesData||!matchesData.matches)return null;
  if(m.matchId){const f=matchesData.matches.find(x=>String(x.matchId)===String(m.matchId));if(f)return f;}
  return matchesData.matches.find(x=>normEq(x.home,m.home)&&normEq(x.away,m.away))||null;
}
// 从已完场比赛推出 胜/平/负
function quickFill(m){
  const fm=findMatch(m);
  if(!fm||fm.status!=='fin'||fm.score_home==null||fm.score_away==null)return null;
  return{score:fm.score_home+'-'+fm.score_away,r:fm.score_home>fm.score_away?'胜':fm.score_home===fm.score_away?'平':'负'};
}
// 按90分钟比分预填赛果(只预填,不直接判定,防让球误判)
function applyResultMatch(m,r,score){
  const opts=pickOptions(m);
  m.score=score||m.score;
  if(opts.includes(r)){m.result='win';m.hit=isDouble(m)?'':r;} // 双选留空待用户确认命中项
  else{m.result='lose';m.hit='';}
}

function doResult(tid,mi,r){
  const t=data.tickets.find(x=>x.id===tid);if(!t)return;
  const m=t.matches[mi];

  else if(r==='lose'){m.result='lose';m.hit='';}
  else{
    if(isDouble(m)){openHitChooser(tid,mi);return;} // 双选必选命中哪个
    m.result='win';m.hit=pickOptions(m)[0];
  }
  afterChange();

function runAutoSettle(){
  const items=[];
  for(const t of data.tickets){
    if(ticketSettled(t))continue;
    for(const m of (t.matches||[])){
      if(m.result&&m.result!=='pending')continue;
      const q=quickFill(m);if(q)items.push({t,m,score:q.score,r:q.r});
    }
  }
  if(!items.length){toast('没有可自动结算的场次(需比赛已完场且有比分)');return;}
  const html='<h3>⚡ 自动结算预填</h3><div class="warn">只预填、不直接判定,含让球盘口请手动核对;双选票预填后请在明细中确认命中选项。</div>'+
    '<div class="auto-list">'+items.map(it=>'<div class="auto-item"><b>'+esc(it.m.home)+' vs '+esc(it.m.away)+'</b><span>完场 '+it.score+' → '+it.r+'</span><span class="mut">选:'+esc(it.m.pick||'—')+'</span></div>').join('')+'</div>'+
    '<div class="mut" style="margin-top:6px">共 '+items.length+' 场</div>';
  showModal(html,()=>{
    let n=0;
    for(const it of items){if(it.m.result&&it.m.result!=='pending')continue;applyResultMatch(it.m,it.r,it.score);n++;}
    afterChange();toast('已预填 '+n+' 场赛果,请核对');
  },'确认生效');
}
/* ---------- 云同步(GitHub Contents API) ---------- */
async function ghGet(path){
  const token=localStorage.getItem(LS_TOKEN);
  const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{headers:{Accept:'application/vnd.github+json',...(token?{Authorization:'token '+token}:{})}});
  if(r.status===401)throw 401;
  if(r.status===404)return null;
  if(!r.ok)throw r.status;
  return r.json();
}
async function ghPut(path,content,sha){
  const token=localStorage.getItem(LS_TOKEN);
  const body={message:'sync '+path,content,...(sha?{sha}:{})};
  const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json',Accept:'application/vnd.github+json',Authorization:'token '+token},body:JSON.stringify(body)});
  if(r.status===401)throw 401;
  if(!r.ok)throw r.status;
  return r.json();
}
// 合并:按票 id 并集;同 id 取 lastModified 新者胜;旧数据(无 lastModified)本地优先
function mergeData(local,remote){
  const lt=Array.isArray(local.tickets)?local.tickets:[];
  const rt=Array.isArray(remote&&remote.tickets)?remote.tickets:[];
  const map=new Map();
  lt.forEach(t=>map.set(t.id,{t}));
  let changed=false;
  rt.forEach(t=>{
    const cur=map.get(t.id);
    if(cur===undefined){map.set(t.id,{t});changed=true;return;}
    const lm=Number(t.lastModified||0),cm=Number(cur.t.lastModified||0);
    if(lm&&cm&&lm>cm){map.set(t.id,{t});changed=true;} // 无 lastModified → 本地优先
  });
  const tickets=[...map.values()].map(x=>x.t).sort((a,b)=>b.id-a.id);
  let capital=local.capital;
  const lts=Number(local.lastModified||0),rts=Number(remote.lastModified||0);
  if(remote.capital!=null&&(local.tickets.length===0||(rts&&(!lts||rts>lts)))){capital=remote.capital;changed=true;}
  return{data:{...local,capital,tickets,lastModified:Date.now()},changed};
}
function setSync(st){
  syncState=st;
  const map={none:['⚪','未配置同步,点击设置'],syncing:['🟡','同步中…'],synced:['🟢','已同步'],error:['🔴','同步失败,点击重试']};
  const [ic,tip]=map[st]||['⚪',''];
  $('#syncIcon').textContent=ic;$('#syncIcon').title=tip;
}
let pushTimer=null, tokenPrompted=false;
function markDirty(){
  dirty=true;
  try{localStorage.setItem(LS_DIRTY,'1');}catch(e){}
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow,2000); // 变更后 debounce 2秒自动推送
}
async function pushNow(){
  const token=localStorage.getItem(LS_TOKEN);
  if(!token){if(!tokenPrompted){tokenPrompted=true;openTokenModal('首次同步需要配置 token');}else setSync('none');return;}
  setSync('syncing');
  try{
    const remote=await ghGet('data.json');
    await ghPut('data.json',b64e(JSON.stringify(data,null,2)),remote?remote.sha:undefined);
    dirty=false;try{localStorage.removeItem(LS_DIRTY);}catch(e){}
    setSync('synced');if(dirty)setTimeout(pushNow,500);
  }catch(e){
    if(e===401){localStorage.removeItem(LS_TOKEN);setSync('none');openTokenModal('token 无效或已过期,请重新输入');return;}
    if(e===409){ // 冲突:重新GET合并再推(重试1次)
      try{
        const remote2=await ghGet('data.json');
        if(remote2){
          const m=mergeData(data,JSON.parse(b64d(remote2.content)));
          data=m.data;saveLocal();renderAll();
          await ghPut('data.json',b64e(JSON.stringify(data,null,2)),remote2.sha);
          dirty=false;try{localStorage.removeItem(LS_DIRTY);}catch(e2){}
          setSync('synced');
        }
      }catch(e2){setSync('error');}
      return;
    }
    setSync('error'); // 失败时数据留在本地不丢失
  }
}
async function pullNow(){
  const token=localStorage.getItem(LS_TOKEN);
  if(!token){setSync('none');return;}
  setSync('syncing');
  try{
    const remote=await ghGet('data.json');
    if(remote){
      const m=mergeData(data,JSON.parse(b64d(remote.content)));
      if(m.changed){data=m.data;saveLocal();renderAll();markDirty();} // 合并出变化则回推云端收敛
    }
    setSync('synced');
    if(dirty)pushNow();
  }catch(e){
    if(e===401){localStorage.removeItem(LS_TOKEN);setSync('none');return;}
    setSync('error');
  }
}
function openTokenModal(msg){
  showModal('<h3>🔑 配置云同步</h3>'+(msg?'<div class="warn">'+esc(msg)+'</div>':'')+
    '<p class="mut" style="font-size:13px">输入 GitHub Personal Access Token(需 <b>repo</b> 权限,或用 fine-grained token 授权 <b>'+REPO+'</b> 的 Contents 读写)。仅保存在本浏览器 localStorage。</p>'+
    '<p class="mut" style="font-size:13px">获取地址:<a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a></p>'+
    '<input id="tokenInput" type="password" placeholder="ghp_xxx 或 github_pat_xxx" style="margin-top:8px">'+
    '<div class="modal-btns"><button class="btn primary" data-act="tokenOk">保存并同步</button></div>');
}
/* ---------- 弹窗/提示 ---------- */
function showModal(html,okFn,okText){
  const m=$('#modal');
  const cancel='<button class="btn" id="modalCancel">取消</button>';
  const ok=okFn?'<button class="btn primary" id="modalOk">'+(okText||'确定')+'</button>':'';
  $('#modalCard').innerHTML=html+'<div class="modal-btns">'+cancel+ok+'</div>';
  m.classList.add('show');
  const okEl=$('#modalOk');if(okEl)okEl.onclick=()=>{hideModal();okFn();};
  $('#modalCancel').onclick=hideModal;
  m.onclick=e=>{if(e.target===m)hideModal();};
}
function hideModal(){$('#modal').classList.remove('show');}
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
/* ---------- 导入/导出 ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();URL.revokeObjectURL(a.href);
}
function openImport(){
  showModal('<h3>📥 导入旧数据</h3><p class="mut" style="font-size:13px">粘贴旧版 data.json(或同结构 JSON),按票 id 合并;同 id 取 lastModified 新者,旧数据(无 lastModified)本地优先。</p>'+
    '<textarea id="impArea" rows="8" placeholder=\'{"capital":500,"tickets":[...]}\' style="width:100%;margin-top:8px;font-family:monospace;font-size:12px;resize:vertical"></textarea>',()=>{
    const raw=$('#impArea').value.trim();
    try{
      const parsed=JSON.parse(raw);
      if(!Array.isArray(parsed.tickets)){toast('格式不对:tickets 数组缺失');return;}
      const m=mergeData(data,parsed);
      data=m.data;saveLocal();markDirty();renderAll();
      toast('导入完成:本地现有 '+data.tickets.length+' 张票');
    }catch(e){toast('JSON 解析失败');}
  },'合并导入');
}
/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('#drawerBg')){closeDrawer();return;}
  if(e.target.closest('#syncIcon')){
    if(syncState==='error')pushNow();
    else if(syncState==='none')openTokenModal();
    else if(syncState==='synced')pullNow();
    else toast('同步中…');
    return;
  }
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act;
  switch(act){
    case 'new':openRecord();break;
    case 'auto':runAutoSettle();break;
    case 'reloadMatches':loadMatches(true);break;
    case 'drawerClose':closeDrawer();break;
    case 'expand':{const c=el.closest('.ticket'),open=c.classList.toggle('open');c.querySelector('.chev').textContent=open?'▲':'▼';break;}
    case 'result':doResult(+el.closest('.ticket').dataset.id,+el.dataset.m,el.dataset.r);break;
    case 'fill':{
      const t=data.tickets.find(x=>x.id===+el.closest('.ticket').dataset.id),mi=+el.dataset.m,m=t.matches[mi],q=quickFill(m);
      showModal('<h3>⚡ 填入赛果</h3><p>'+esc(m.home)+' vs '+esc(m.away)+'</p><p>完场 '+q.score+' → <b>'+q.r+'</b></p><div class="warn">按 90 分钟比分预填,让球盘口请手动核对</div>',()=>{applyResultMatch(m,q.r,q.score);afterChange();},'填入生效');
      break;}
    case 'edit':{const tid=+el.closest('.ticket').dataset.id;openRecord(null,data.tickets.find(x=>x.id===tid));break;}
    case 'del':{const tid=+el.closest('.ticket').dataset.id,t=data.tickets.find(x=>x.id===tid);
      showModal('<h3>🗑️ 删除投注</h3><p>确定删除 '+esc(t.type)+' 票(投入 '+fmtMoney(t.stake)+' 元)吗?</p>',()=>{data.tickets=data.tickets.filter(x=>x.id!==tid);afterChange();},'删除');break;}
    case 'hit':{
      const t=data.tickets.find(x=>x.id===+el.dataset.tid);if(!t)return;
      const m=t.matches[+el.dataset.mi];m.result='win';m.hit=el.dataset.v;hideModal();afterChange();break;}
    case 'lg':D.league=el.dataset.lg;renderLgChips();renderPickList();break;
    case 'prefill':{const m=matchesData&&matchesData.matches[+el.dataset.i];if(m)openRecord(m);break;}
    case 'pickmatch':pickMatch(+el.dataset.i);break;
    case 'man':D.manual=true;renderPickList();break;
    case 'manHide':D.manual=false;renderPickList();break;
    case 'manAdd':manualAdd();break;
    case 'pick':{const si=+el.dataset.si;if(D.sel[si]){D.sel[si].pick=D.sel[si].pick===el.dataset.pk?'':el.dataset.pk;renderSelCards();renderBetBar();}break;}
    case 'rm':D.sel.splice(+el.dataset.si,1);renderSelCards();renderBetBar();renderPickList();break;
    case 'mu':D.multi=Math.min(99,Math.max(1,D.multi+ +el.dataset.d));D.stakeManual=false;renderBetBar();break;
    case 'save':saveTicket();break;
    case 'more':$('#pickSec').scrollIntoView({behavior:'smooth'});break;
    case 'export':exportData();break;
    case 'import':openImport();break;
    case 'tokenOk':{
      const v=$('#tokenInput').value.trim();
      if(!v){toast('请输入 token');break;}
      localStorage.setItem(LS_TOKEN,v);hideModal();setSync('syncing');pushNow();break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='stakeInput'){D.stake=parseFloat(el.value)||0;D.stakeManual=true;}
  if(el.dataset&&el.dataset.o!==undefined){const si=+el.dataset.si;if(D.sel[si])D.sel[si].odds[el.dataset.o]=el.value;}
});
/* ---------- 启动 ---------- */
function initClock(){
  const tick=()=>{$('#clock').textContent=beijingDateStr().slice(5)+' '+beijingClock();};
  tick();setInterval(tick,1000);
}
function init(){
  loadLocal();
  if(localStorage.getItem(LS_DIRTY)==='1')dirty=true; // 上次没推成功,本次自动补推
  renderAll();
  initClock();
  loadMatches();
  setInterval(()=>loadMatches(),5*60*1000);           // matches.json 自动刷新(≥5分钟)
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastMatchFetch>300000)loadMatches();});
  setInterval(renderStats,60000);                      // 跨零点刷新"今日"
  pullNow();                                           // 启动自动拉云端合并
  window.addEventListener('online',()=>{if(dirty)pushNow();}); // 恢复网络自动补推
}
init();
</script>
