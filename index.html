// ===== 🔄 自动同步(方案C) =====
function autoSync() {
  const token = localStorage.getItem('gh_sync_token');
  if (!token) return; // 没存token就不自动同步
  
  const data = loadData();
  const json = JSON.stringify(data, null, 2);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  
  fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', {
    headers: {'Authorization': 'token ' + token}
  })
  .then(r => r.json())
  .then(existing => {
    return fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', {
      method: 'PUT',
      headers: {'Authorization': 'token ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({
        message: '🔄 自动同步 ' + new Date().toISOString().slice(0,10),
        content: b64,
        sha: existing.sha,
        branch: 'main'
      })
    });
  })
  .catch(() => {}); // 静默失败，不影响用户操作
}

// ===== ☁️ 一键同步到云 端 =====
function syncToCloud() {
  let token = localStorage.getItem('gh_sync_token');
  if (!token) {
    token = prompt('请输入 GitHub Token\n(只存本地，一次输入永久有效)\nhttps://github.com/settings/tokens');
    if (!token) return;
    localStorage.setItem('gh_sync_token', token);
  }
  
  const btn = document.querySelector('button[onclick*="syncToCloud"]');
  const origText = btn.textContent;
  btn.textContent = '⏳ 同步中...';
  btn.disabled = true;
  
  const data = loadData();
  const json = JSON.stringify(data, null, 2);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  
  // 获取当前data.json的SHA
  fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', {
    headers: {'Authorization': 'token ' + token}
  })
  .then(r => r.json())
  .then(existing => {
    const sha = existing.sha;
    // 上传新数据
    return fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', {
      method: 'PUT',
      headers: {'Authorization': 'token ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({
        message: '📊 看板同步 ' + new Date().toISOString().slice(0,10),
        content: b64,
        sha: sha,
        branch: 'main'
      })
    });
  })
  .then(r => {
    if (r.ok) {
      btn.textContent = '✅ 已同步';
      setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 2000);
    } else {
      throw new Error('HTTP ' + r.status);
    }
  })
  .catch(e => {
    btn.textContent = '❌ 失败';
    setTimeout(() => { btn.textContent = origText; btn.disabled = false; }, 3000);
    if (e.message.includes('401') || e.message.includes('403')) {
      localStorage.removeItem('gh_sync_token');
      alert('Token 无效或已过期，请重新生成\nhttps://github.com/settings/tokens');
    } else {
      alert('同步失败: ' + e.message);
    }
  });
}

// ===== 云端同步 =====
function syncToCloud() {
  const data = loadData();
  if (!data) return;
  const json = JSON.stringify(data, null, 2);
  // 用GitHub API推送data.json更新
  // 注意: 需要配置GH_TOKEN环境变量，或手动导出导入
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data_export.json';
  a.click();
  alert('✅ 数据已导出!\n请上传此文件到GitHub仓库覆盖data.json');
}

// 页面加载时从云端获取数据
async function loadCloudData() {
  try {
    const resp = await fetch('data.json?_=' + Date.now());
    if (!resp.ok) return null;
    const cloud = await resp.json();
    const local = loadData();
    // 合并: 云端结果覆盖本地待赛
    if (cloud && cloud.tickets) {
      cloud.tickets.forEach(ct => {
        const lt = local.tickets.find(t => t.id === ct.id);
        if (lt) {
          ct.matches.forEach((cm, i) => {
            if (lt.matches[i] && cm.result !== 'pending') {
              lt.matches[i].result = cm.result;
              if (cm.score) lt.matches[i].score = cm.score;
            }
          });
        }
      });
      localStorage.setItem('fb_dashboard_v2', JSON.stringify(local));
      if (typeof render === 'function') render();
    }
  } catch(e) {}
}
// 页面加载后拉取云端数据
if (document.readyState === 'complete') loadCloudData();
else window.addEventListener('load', loadCloudData);

let data = loadData();
let charts = {};

function loadData() {
  // 从localStorage读取本地数据
  const raw = localStorage.getItem('fb_dashboard_v2');
  let local = null;
  if (raw) try { local = JSON.parse(raw); } catch(e) {}
  
  // 自动合并DEFAULT_DATA中新增的票(如新投注)到已有数据中
  if (local) {
    let changed = false;
    DEFAULT_DATA.tickets.forEach(dt => {
      if (!local.tickets.find(t => t.id === dt.id)) {
        local.tickets.push(dt);
        changed = true;
      }
    });
    if (changed) {
      localStorage.setItem('fb_dashboard_v2', JSON.stringify(local));
    }
  }
  
  // 从云端data.json获取(自动更新的比分结果)
  fetch('data.json?_=' + Date.now())
    .then(r => r.json())
    .then(cloud => {
      // 合并云端数据到localStorage(只合并已出结果的比赛)
      if (cloud && cloud.tickets) {
        let merged = local || JSON.parse(JSON.stringify(DEFAULT_DATA));
        cloud.tickets.forEach(ct => {
          let existing = merged.tickets.find(t => t.id === ct.id);
          if (existing) {
            // 合并每场比赛的结果(云端优先: 如果云端有结果就覆盖)
            ct.matches.forEach((cm, i) => {
              if (existing.matches[i] && cm.result !== 'pending') {
                existing.matches[i].result = cm.result;
                if (cm.score) existing.matches[i].score = cm.score;
              }
            });
          }
        });
        localStorage.setItem('fb_dashboard_v2', JSON.stringify(merged));
        // 如果当前页面已加载，重新渲染
        if (typeof render === 'function') render();
      }
    })
    .catch(() => {}); // 离线时忽略
  
  return local || JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function save() { localStorage.setItem('fb_dashboard_v2', JSON.stringify(data)); }

function autoCalcStake() {
  const type = document.getElementById('fType').value;
  const multi = parseInt(document.getElementById('fMul').value) || 1;
  const picks = document.querySelectorAll('.mPick');
  let combos = 1;
  picks.forEach(p => { if (p.value.includes('或')) combos *= 2; });
  const total = 2 * multi * combos;
  document.getElementById('fStake').value = total;
  document.getElementById('fStakeDisplay').textContent = total + ' 元';
  document.getElementById('stakeHint').textContent = total > 0
    ? `${multi}倍 × ${combos}组合 × 2元`
    : '';
  // 同时更新赔率标签
  updateOddsLabels();
}

function updateOddsLabels() {
  document.querySelectorAll('.match-box').forEach(box => {
    const pick = box.querySelector('.mPick')?.value || '';
    const odds1Label = box.querySelector('.odds1-label');
    const odds2Label = box.querySelector('.odds2-label');
    if (odds1Label) {
      if (!pick.includes('或')) {
        odds1Label.textContent = pick + '赔率';
      } else {
        const picks = pick.split('或');
        odds1Label.textContent = picks[0] + '赔率';
      }
    }
    if (odds2Label) {
      const picks = pick.split('或');
      odds2Label.textContent = picks[1] + '赔率';
    }
  });
}

// ================================================================
// 核心计算
// ================================================================
function analyze() {
  const tickets = data.tickets;
  let totalStake = 0, totalPayout = 0;
  let histStake = 0, histPayout = 0;
  let todayStake = 0, todayPayout = 0;
  let wonTickets = 0, winPicks = 0, totalPicks = 0;
  const leagues = {}, picks = {}, types = {};
  const series = [];
  let cum = 0;
  const dates = tickets.map(t=>t.date).sort();
  const latestDate = dates[dates.length-1] || '';

  tickets.forEach(t => {
    const hasPending = t.matches.some(m => m.result === 'pending');
    const allWin = t.matches.every(m => m.result === 'win');
    const payout = hasPending ? 0 : calcPayout(t, allWin);
    
    // 待赛的票只记投入，不算盈亏
    totalStake += t.stake;
    if (!hasPending) totalPayout += payout;
    
    if (t.date === latestDate) {
      todayStake += t.stake;
      if (!hasPending) todayPayout += payout;
    } else {
      if (!hasPending) { histStake += t.stake; histPayout += payout; }
    }
    
    if (allWin && !hasPending) wonTickets++;

    if (!types[t.type]) types[t.type] = { n:0, w:0, stake:0, payout:0 };
    types[t.type].n++;
    if (allWin && !hasPending) { types[t.type].w++; types[t.type].payout += payout; }
    types[t.type].stake += t.stake;

    t.matches.forEach(m => {
      totalPicks++;
      if (m.result === 'win') winPicks++;
      const pk = m.pick.includes('或') ? '双选' : m.pick;
      if (!picks[pk]) picks[pk] = { n:0, w:0, stake:0, payout:0 };
      picks[pk].n++; if (m.result === 'win') picks[pk].w++;
      picks[pk].stake += t.stake / t.matches.length;
      if (allWin && !hasPending) picks[pk].payout += payout / t.matches.length;
      const lg = m.league || '其他';
      if (!leagues[lg]) leagues[lg] = { n:0, w:0, stake:0, payout:0 };
      leagues[lg].n++; if (m.result === 'win') leagues[lg].w++;
      leagues[lg].stake += t.stake / t.matches.length;
      if (allWin && !hasPending) leagues[lg].payout += payout / t.matches.length;
    });
    if (!hasPending) {
      cum += payout - t.stake;
      series.push({ label: `#${t.id}`, cum: Math.round(cum*100)/100, date: t.date });
    }
  });

  const pnl = totalPayout - totalStake;
  // 去掉待赛票的投入，算"已结算"盈亏
  const pendingStakeAll = tickets.filter(t => t.matches.some(m => m.result === 'pending')).reduce((s,t) => s + t.stake, 0);
  const settledPnl = totalPayout - (totalStake - pendingStakeAll);
  return {
    tickets, totalStake, totalPayout, pnl, available: data.capital + pnl,
    settledPnl, settledAvailable: data.capital + settledPnl, pendingStakeAll,
    histStake, histPayout, todayStake, todayPayout, todayPnl: todayPayout - todayStake,
    wonTickets, totalTickets: tickets.length,
    ticketRate: tickets.length ? wonTickets/tickets.length : 0,
    winPicks, totalPicks, pickRate: totalPicks ? winPicks/totalPicks : 0,
    leagues, picks, types, series, latestDate
  };
}

function calcPayout(t, w) {
  if (!w) return 0;
  if (t.type === '单场固定') return Math.round(t.matches[0].odds * 2 * t.multi);
  const prod = t.matches.reduce((s,m) => s * m.odds, 1);
  return Math.round(prod * 2 * t.multi);
}

// ================================================================
// 渲染
// ================================================================
function render() {
  const s = analyze();
  document.getElementById('cardCapital').textContent = data.capital;
  document.getElementById('cardAvailable').textContent = Math.round(s.settledAvailable);
  const pnlEl = document.getElementById('cardPnl');
  pnlEl.textContent = (s.settledPnl >= 0 ? '+' : '') + Math.round(s.settledPnl*100)/100;
  pnlEl.className = 'stat-value ' + (s.settledPnl >= 0 ? 'win' : 'lose');
  // 今日战绩：显示最近已结算日期的结果
  const todayPending = s.tickets.filter(t => t.date === s.latestDate && t.matches.some(m => m.result === 'pending'));
  const todayPendingStake = todayPending.reduce((st, t) => st + t.stake, 0);
  // 找最近有已结算结果的日期
  let settledDate = s.latestDate;
  if (todayPendingStake > 0) {
    // 如果最新日期全是待赛，往前找有结果的日期
    const settledTickets = s.tickets.filter(t => !t.matches.some(m => m.result === 'pending'));
    if (settledTickets.length > 0) {
      const dates = [...new Set(settledTickets.map(t=>t.date))].sort();
      settledDate = dates[dates.length-1];
    }
  }
  // 重新计算选定日期的已结算盈亏
  const dayTickets = s.tickets.filter(t => t.date === settledDate && !t.matches.some(m => m.result === 'pending'));
  const dayStake = dayTickets.reduce((st,t) => st + t.stake, 0);
  const dayPayout = dayTickets.reduce((st,t) => st + (t.matches.every(m=>m.result==='win') ? calcPayout(t,true) : 0), 0);
  const dayPnl = dayPayout - dayStake;
  
  const tEl = document.getElementById('cardToday');
  if (s.pendingStakeAll > 0) {
    tEl.innerHTML = (dayPnl >= 0 ? '+' : '') + Math.round(dayPnl) + '元'
      + '<span style="font-size:11px;display:block;color:#94a3b8;">' + settledDate + '结算</span>'
      + '<span style="font-size:12px;display:block;color:#f59e0b;">待赛' + s.pendingStakeAll + '元</span>';
  } else {
    tEl.textContent = (dayPnl >= 0 ? '+' : '') + Math.round(dayPnl);
  }
  tEl.className = 'stat-value ' + (dayPnl >= 0 ? 'win' : 'lose');
  document.getElementById('cardWinRate').textContent = (s.ticketRate * 100).toFixed(0) + '%';
  document.getElementById('cardSingleRate').textContent = (s.pickRate * 100).toFixed(0) + '%';

  const loss = Math.abs(s.settledPnl);
  document.getElementById('recoveryText').textContent = loss > 0 ? `已亏 ${Math.round(loss)} 元 · 还需 ${Math.round(loss)} 元回本` : '已回本! 🎉';
  document.getElementById('recoveryBar').style.width = Math.max(0, Math.min(100, (1-loss/87)*100)) + '%';
  document.getElementById('recoveryAvailable').textContent = Math.round(s.settledAvailable);

  renderRecords(s);
  renderCharts(s);
  renderAnalysis(s);
  renderPlan(s);
  save();
}

          <span class="${pnl >= 0 ? 'win' : 'lose'} font-bold">${pnl >= 0 ? '+' : ''}${pnl}元</span>
        </div>
      </div>
      ${matchesHtml}
    </div>`;
  }).join('');
}

// 实时更新赛果
function updateMatchResult(ticketId, matchIdx, newResult) {
  const ticket = data.tickets.find(t => t.id === ticketId);
  if (!ticket || !ticket.matches[matchIdx]) return;
  ticket.matches[matchIdx].result = newResult;
  render();
  setTimeout(autoSync, 500);
}

// 实时更新比分
function updateMatchScore(ticketId, matchIdx, newScore) {
  const ticket = data.tickets.find(t => t.id === ticketId);
  if (!ticket || !ticket.matches[matchIdx]) return;
  ticket.matches[matchIdx].score = newScore;
  // 比分变了自动判断结果
  const m = ticket.matches[matchIdx];
  if (newScore && newScore.includes('-')) {
    const parts = newScore.split('-');
    const h = parseInt(parts[0]), a = parseInt(parts[1]);
    if (!isNaN(h) && !isNaN(a)) {
      const actual = h > a ? '胜' : h < a ? '负' : '平';
      if (m.pick === actual || (m.pick.includes('或') && m.pick.split('或').includes(actual))) {
        m.result = 'win';
      } else {
        m.result = 'lose';
      }
    }
  }
  render();
  setTimeout(autoSync, 500);
}

function autoResizeInput(el) {
  el.style.width = Math.max(30, Math.min(60, el.value.length * 10)) + 'px';
}

// 实时更新赔率
function updateMatchOdds(ticketId, matchIdx, field, value) {
  const ticket = data.tickets.find(t => t.id === ticketId);
  if (!ticket || !ticket.matches[matchIdx]) return;
  const parsed = parseFloat(value);
  if (isNaN(parsed) || parsed < 1) return;
  ticket.matches[matchIdx][field] = parsed;
  render();
  setTimeout(autoSync, 500);
}

    plugins: { legend: { labels: { color: '#94a3b8' } } },

  const lastPnl = s.series.length ? s.series[s.series.length-1].cum : 0;

  if (charts.pnl) charts.pnl.destroy();
  charts.pnl = new Chart(document.getElementById('pnlChart'), {
    type: 'line', data: {
      labels: s.series.map(x=>x.label),
      datasets: [{ label:'累计盈亏', data: s.series.map(x=>x.cum),
        borderColor: lastPnl>=0?'#22c55e':'#ef4444', tension: 0.3,
        pointBackgroundColor: s.series.map(x=>x.cum>=0?'#22c55e':'#ef4444'), pointRadius: 3,
        fill: true, backgroundColor: (lastPnl>=0?'#22c55e':'#ef4444')+'11' }]
    }, options: { ...opts, plugins: { ...opts.plugins, legend: { display: false } } }
  });

  if (charts.type) charts.type.destroy();
  const tl = Object.keys(s.types);
  charts.type = new Chart(document.getElementById('typeChart'), {
    type: 'bar', data: {
      labels: tl,
      datasets: [
        { label:'中', data: tl.map(t=>s.types[t].w), backgroundColor:'#22c55e', borderRadius:4 },
        { label:'未中', data: tl.map(t=>s.types[t].n-s.types[t].w), backgroundColor:'#ef4444', borderRadius:4 }
      ]
    }, options: { ...opts, plugins: { ...opts.plugins, title: { display:true, text:'📊 投注方式', color:'#e2e8f0' } },
      scales: { x: { stacked:true }, y: { stacked:true } } }
  });

  if (charts.league) charts.league.destroy();
  const ll = Object.keys(s.leagues);
  const lp = ll.map(l => Math.round((s.leagues[l].payout-s.leagues[l].stake)*100)/100);
  charts.league = new Chart(document.getElementById('leagueChart'), {
    type: 'bar', data: {
      labels: ll,
      datasets: [{ label:'净盈亏', data: lp,
        backgroundColor: lp.map(v=>v>=0?'#22c55e88':'#ef444488'),
        borderColor: lp.map(v=>v>=0?'#22c55e':'#ef4444'), borderWidth: 1, borderRadius: 4 }]
    }, options: { ...opts, plugins: { ...opts.plugins, title: { display:true, text:'🏆 联赛盈亏', color:'#e2e8f0' }, legend: { display:false } }, indexAxis: 'y' }
  });
}

function renderAnalysis(s) {
  if (charts.pick) charts.pick.destroy();
  const pl = Object.keys(s.picks);
  charts.pick = new Chart(document.getElementById('pickChart'), {
    type: 'doughnut', data: {
      labels: pl.map(p=>`${p} (${s.picks[p].n}次)`),
      datasets: [{ data: pl.map(p=>s.picks[p].n), backgroundColor:['#3b82f6','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'], borderWidth:0 }]
    }, options: { responsive:true, maintainAspectRatio:false,
      plugins: { legend: { position:'right', labels:{ color:'#94a3b8' } }, title: { display:true, text:'🎯 选项分布', color:'#e2e8f0' } } }
  });

  if (charts.pickPnl) charts.pickPnl.destroy();
  const pp = pl.map(p => Math.round((s.picks[p].payout-s.picks[p].stake)*100)/100);
  charts.pickPnl = new Chart(document.getElementById('pickPnlChart'), {
    type: 'bar', data: {
      labels: pl,
      datasets: [{ label:'盈亏', data: pp,
        backgroundColor: pp.map(v=>v>=0?'#22c55e88':'#ef444488'),
        borderColor: pp.map(v=>v>=0?'#22c55e':'#ef4444'), borderWidth:1, borderRadius:4 }]
    }, options: { responsive:true, maintainAspectRatio:false,
      plugins: { legend: { display:false }, title: { display:true, text:'💰 选项盈亏', color:'#e2e8f0' } },
      scales: { y:{ ticks:{ color:'#64748b' } }, x:{ ticks:{ color:'#94a3b8' } } } }
  });

  if (charts.trend) charts.trend.destroy();
  const tw=5, tr=[], ttl=[];
  s.tickets.forEach((t,i) => {
    const st = Math.max(0,i-tw+1);
    tr.push(Math.round(s.tickets.slice(st,i+1).filter(x=>x.matches.every(m=>m.result==='win')).length/(i-st+1)*100));
    ttl.push(`#${t.id}`);
  });
  charts.trend = new Chart(document.getElementById('trendChart'), {
    type: 'line', data: {
      labels: ttl,
      datasets: [{ label:'近5票命中率', data: tr, borderColor:'#f59e0b', backgroundColor:'#f59e0b22', fill:true, tension:0.3, pointRadius:3 }]
    }, options: { responsive:true, maintainAspectRatio:false,
      plugins: { legend: { labels:{ color:'#94a3b8' } }, title: { display:true, text:'📈 滚动命中率', color:'#e2e8f0' } },
      scales: { y:{ min:0, max:100, ticks:{ callback:v=>v+'%' } }, x:{ ticks:{ color:'#64748b' } } } }
  });

  const allM = s.tickets.flatMap(t=>t.matches);
  const flatBets = allM.filter(m => m.pick === '平');
  const flatRate = flatBets.length ? Math.round(flatBets.filter(m=>m.result==='win').length/flatBets.length*100) : 0;
  const dub = allM.filter(m => m.pick.includes('或'));
  const dubRate = dub.length ? Math.round(dub.filter(m=>m.result==='win').length/dub.length*100) : 0;
  let bestL='', bestV=-999;
  Object.keys(s.leagues).forEach(l => { const v=s.leagues[l].payout-s.leagues[l].stake; if(v>bestV&&s.leagues[l].n>=2){bestV=v;bestL=l;} });

  document.getElementById('insights').innerHTML = [
    { i:'🤔', t:`选平${flatBets.length}次中${flatBets.filter(m=>m.result==='win').length}次`, d:`平局命中率 ${flatRate}%` },
    { i:'💡', t:`双选${dub.length}次中${dub.filter(m=>m.result==='win').length}次`, d:`双选命中率 ${dubRate}%` },
    { i:'🏆', t: bestL ? `最佳联赛: ${bestL}` : '数据不足', d: bestL ? `盈亏 ${Math.round(bestV)} 元` : '' },
    { i:'📉', t:`串关 ${s.wonTickets}/${s.totalTickets} 中`, d:`命中率 ${(s.ticketRate*100).toFixed(0)}%` },
    { i:'🔥', t:'今日战绩', d: `${s.todayPnl >= 0 ? '+' : ''}${Math.round(s.todayPnl)} 元${s.pendingStakeAll > 0 ? ' (待赛'+s.pendingStakeAll+'元)' : ''}` }
  ].map(x => `<div class="flex gap-3 items-start p-3 bg-slate-800/50 rounded-lg"><span class="text-lg">${x.i}</span><div><div class="font-semibold text-sm">${x.t}</div><div class="text-xs text-slate-400">${x.d}</div></div></div>`).join('');
}

function addBet() {
  const date = document.getElementById('fDate').value;
  const type = document.getElementById('fType').value;
  const multi = parseInt(document.getElementById('fMul').value) || 1;
  let stake = parseInt(document.getElementById('fStake').value);
  const matchDivs = document.querySelectorAll('.match-box');

  if (matchDivs.length === 0) { showMsg('请先选择串关类型', false); return; }

  const matches = [];
  let valid = true;
  matchDivs.forEach(div => {
    const home = div.querySelector('.mHome').value.trim();
    const away = div.querySelector('.mAway').value.trim();
    const pick = div.querySelector('.mPick').value;
    const odds = parseFloat(div.querySelector('.mOdds').value);
    const odds2El = div.querySelector('.mOdds2');
    const odds2 = odds2El && odds2El.style.display !== 'none' ? parseFloat(odds2El.value) : null;
    const result = div.querySelector('.mResult').value;
    const score = div.querySelector('.mScore')?.value.trim() || '';
    const league = div.querySelector('.mLeague').value.trim() || '其他';
    if (!home || !away || !odds) { valid = false; return; }
    // 双选时存两个赔率，单选只存一个
    const finalOdds = pick.includes('或') ? odds : odds;
    matches.push({ home, away, pick, odds: finalOdds, odds2, score, result, league });
  });

  if (!valid) { showMsg('请填完所有比赛的主队、客队、赔率', false); return; }

  if (!stake || stake < 2) {
    let combos = 1;
    matches.forEach(m => { if (m.pick.includes('或')) combos *= 2; });
    stake = 2 * multi * combos;
  }

  const newId = Math.max(...data.tickets.map(t=>t.id), 0) + 1;
  data.tickets.push({ id: newId, date: date || new Date().toISOString().slice(0,10), type, multi, stake, matches });
  showMsg(`✅ 已添加 #${newId} (${type}, ${matches.length}场, ${stake}元)`, true);
  document.querySelectorAll('.mHome,.mAway,.mOdds,.mScore,.mLeague').forEach(el => el.value = '');
  document.querySelectorAll('.mResult').forEach(el => el.value = 'pending');
  render();
  setTimeout(autoSync, 500);
}

function showMsg(msg, ok) {
  const el = document.getElementById('addMsg');
  el.textContent = msg;
  el.className = 'mt-3 text-sm font-semibold ' + (ok ? 'win' : 'lose');
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

function exportData() {
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `竞彩数据_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function resetData() {
  if (confirm('确认重置？')) {
    localStorage.removeItem('fb_dashboard_v2');
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    render();
  }
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  btn.classList.add('active');
  setTimeout(() => Object.values(charts).forEach(c => c?.resize()), 100);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
  rebuildMatchFields();
  render();
});
