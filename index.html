<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>飞翔大魔王 · 竞彩看板</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

*{font-family:'Noto Sans SC',sans-serif}

body{background:#0f172a;color:#e2e8f0}

.card{background:#1e293b;border-radius:16px;border:1px solid #334155;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.25)}

.stat-value{font-size:28px;font-weight:900}

.stat-label{font-size:13px;color:#94a3b8;margin-top:2px}

.win{color:#eab308}.lose{color:#ff0000}.neutral{color:#f59e0b}

.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}

.chip-win{background:#eab30822;color:#eab308;border:1px solid #eab30844}

.chip-lose{background:#ff000022;color:#ff0000;border:1px solid #ff000044}

.chip-pending{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b44}

.btn{padding:8px 20px;border-radius:10px;font-weight:600;cursor:pointer}

.btn-primary{background:#3b82f6;color:white;border:none}

.btn-sm{padding:4px 12px;font-size:13px}

.input-field{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#e2e8f0;width:100%;outline:none}

.progress-bar{height:8px;border-radius:999px;background:#334155;overflow:hidden}

.progress-fill{height:100%;border-radius:999px;transition:width .5s}

.tab-btn{padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid transparent;background:transparent;color:#94a3b8}

.tab-btn.active{background:#3b82f6;color:white}

.hidden{display:none}

.match-box{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:16px}

.ticket-group{background:#0f172a;border-radius:10px;overflow:hidden}

.ticket-row:not(:last-child){border-bottom:2px dashed #334155}

.ticket-header{background:#1e293b;padding:6px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center}

</style>

</head>

<body>

<div class="max-w-7xl mx-auto px-4 py-6">

<div class="flex items-center justify-between mb-6">

<div><h1 class="text-2xl font-black text-white">⚽ 竞彩投资看板</h1><p class="text-sm text-slate-400 mt-1">飞翔大魔王 · 验证期 · 三阶段计划 <span id="liveClock" style="color:#eab308;font-weight:600;margin-left:8px;font-family:monospace"></span></p></div>

<div class="flex gap-2">

<button onclick="syncToCloud()" class="btn btn-sm" style="background:#eab308;color:white">☁️ 推云端</button>

<button onclick="autoSettleAll()" class="btn btn-sm" style="background:#22c55e;color:white">⚡ 自动结算</button>

<button onclick="pullFromCloud()" class="btn btn-sm" style="background:#3b82f6;color:white">📥 从云端拉</button>

<button onclick="exportData()" class="btn btn-sm" style="background:#334155;color:#94a3b8">📥 导出</button>

</div>

</div>

<div class="grid grid-cols-2 md:grid-cols-7 gap-4 mb-6">

<div class="card text-center"><div class="stat-label">💰 起始本金</div><div class="stat-value" style="color:#60a5fa" id="cCapital">500</div></div>

<div class="card text-center"><div class="stat-label">🟢 当前可用</div><div class="stat-value win" id="cAvail">0</div></div>

<div class="card text-center"><div class="stat-label">📊 累计盈亏</div><div class="stat-value" id="cPnl">0</div></div>

<div class="card text-center"><div class="stat-label">🔥 今日战绩</div><div class="stat-value" id="cToday">0</div><div id="cTodayExtra" style="font-size:10px;color:#64748b;margin-top:-4px"></div></div>

<div class="card text-center"><div class="stat-label">🎯 串关命中率</div><div class="stat-value neutral" id="cTicketRate">0%</div></div>

<div class="card text-center"><div class="stat-label">📋 单场命中率</div><div class="stat-value neutral" id="cPickRate">0%</div></div>

<div class="card text-center"><div class="stat-label">📊 投注ROI</div><div class="stat-value neutral" id="cROI">—</div><div id="cROIExtra" style="font-size:10px;color:#64748b;margin-top:-4px"></div></div>

</div>

<div class="card mb-6">

<div class="stat-label mb-3">📋 最新投注</div>

<div id="latestBets"></div>

</div>



<div class="flex gap-2 mb-4 flex-wrap">

<button class="tab-btn active" onclick="switchTab('dashboard',this)">📊 总览</button>

<button class="tab-btn" onclick="switchTab('records',this)">📋 记录</button>

<button class="tab-btn" onclick="switchTab('analysis',this)">🔍 分析</button>

<button class="tab-btn" onclick="switchTab('plan',this)">🎯 计划</button>

<button class="tab-btn" onclick="switchTab('add',this)">➕ 添加</button>

</div>

<div id="tab-dashboard" class="tab-content">

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

<div class="card lg:col-span-2"><div style="position:relative;height:420px"><canvas id="pnlChart"></canvas></div></div>

<div class="card"><div style="position:relative;height:420px"><canvas id="typeChart"></canvas></div></div>

<div class="card"><div style="position:relative;height:420px"><canvas id="leagueChart"></canvas></div></div>

</div>

</div>

<div id="tab-records" class="tab-content hidden"><div class="card overflow-x-auto p-0" id="recordsContainer"></div></div>

<div id="tab-analysis" class="tab-content hidden">

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

<div class="card"><canvas id="pickChart" height="240"></canvas></div>

<div class="card"><canvas id="pickPnlChart" height="240"></canvas></div>

<div class="card"><canvas id="trendChart" height="240"></canvas></div>

<div class="card"><div class="stat-label mb-3">💡 关键发现</div><div id="insights" class="space-y-3 text-sm"></div></div>

</div>

</div>

<div id="tab-plan" class="tab-content hidden">

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

<div class="card lg:col-span-2"><div class="stat-label mb-3">📅 三阶段计划</div><div id="phasePlan" class="space-y-4"></div></div>

<div class="card"><div class="stat-label mb-3">🎯 目标追踪</div><div id="goalTracking" class="space-y-4"></div></div>

</div>

</div>

<div id="tab-add" class="tab-content hidden">

<div class="card max-w-3xl"><div class="stat-label mb-4">➕ 添加新投注</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">

<div><label class="text-xs text-slate-400 block mb-1">日期</label><input class="input-field" id="fDate" type="date"></div>

<div><label class="text-xs text-slate-400 block mb-1">串关类型</label><select class="input-field" id="fType" onchange="rebuildMatchFields();setTimeout(autoCalcStake,100)"><option value="单场固定">单场固定</option><option value="2x1" selected>2x1</option><option value="3x1">3x1</option><option value="4x1">4x1</option><option value="5x1">5x1</option><option value="6x1">6x1</option><option value="7x1">7x1</option><option value="8x1">8x1</option></select></div>

<div><label class="text-xs text-slate-400 block mb-1">倍数</label><input class="input-field" id="fMul" type="number" min="1" value="1" oninput="autoCalcStake()"></div>

<div><label class="text-xs text-slate-400 block mb-1">本单金额</label><div class="input-field" id="fStakeDisplay" style="display:flex;align-items:center;font-weight:700;color:#eab308">0 元</div><input type="hidden" id="fStake" value="0"><div id="fComboInfo" style="font-size:11px;color:#64748b;margin-top:4px;min-height:16px"></div></div>

</div>

<div id="matchFieldsContainer" class="space-y-3 mb-4"></div>

<div class="flex gap-3"><button onclick="addBet()" class="btn btn-primary">➕ 添加此单</button></div>

<div id="addMsg" class="mt-3 text-sm hidden"></div>

</div>

</div>

</div>

// 北京时间工具：返回当前北京日期 YYYY-MM-DD（Intl 指定 Asia/Shanghai，任何设备时区都正确）

function bjToday() {

  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());

}

// 实时时钟：每秒刷新北京时间（Intl 指定 Asia/Shanghai，任何设备时区都正确）

function startLiveClock() {

  const el = document.getElementById('liveClock');

  if (!el) return;

  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

  function tick() {

    const parts = fmt.formatToParts(new Date());

    const get = t => (parts.find(p => p.type === t) || {}).value || '00';

    let h = get('hour'); if (h === '24') h = '00'; // 深夜 Intl 可能给 24，修正为 00

    el.textContent = '🕐 ' + get('year') + '-' + get('month') + '-' + get('day') + ' ' + h + ':' + get('minute') + ':' + get('second') + ' BJT';

  }

  tick();

  setInterval(tick, 1000);

}



// 投注ROI：roi=累计盈亏/总投入(竞彩标准:每投100元拿回多少)，turnover=资金周转率(总投入/本金)

function calcROI(pnl, totalStake) {

  const CAP = 500;

  const tickets = data.tickets;

  if (!tickets.length) return { roi: null, turnover: 0, days: 0 };

  const parseDate = s => { const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };

  let firstDate = null;

  tickets.forEach(t => { const d = parseDate(t.date); if (!firstDate || d < firstDate) firstDate = d; });

  const today = parseDate(bjToday());

  const days = Math.max(1, Math.round((today - firstDate) / 86400000) + 1);

  const roi = totalStake > 0 ? (pnl / totalStake) * 100 : 0;

  const turnover = totalStake / CAP;

  return { roi, turnover, days };

}

// 原则: 永不整体覆盖。按票id取并集, 同一场比赛取"已结算/更新"的一份, 冲突保留本地并标记。

function isSettled(m){ return !!(m && m.result && m.result !== 'pending'); }

function mKey(m){ return (m.home||'')+'|'+(m.away||''); }

function tsOf(t){ return t.lastModified || ''; }



// 合并同一场比赛: 已结算 > pending; 都结算取时间戳新者(票级优先, match级兜底); 冲突保留本地并打标

function mergeMatch(a, b, ta, tb){

  var as=isSettled(a), bs=isSettled(b);

  if(as && !bs) return a;

  if(bs && !as) return b;

  if(as && bs){

    var tma=tsOf(a), tmb=tsOf(b);

    var tA = tma || ta || '', tB = tmb || tb || '';

    if(tA && tB) return tA >= tB ? a : b;

    if(a.score !== b.score){ try{ a._conflict = (a._conflict||'') + ' 云端#' + b.score; }catch(e){} }

    return a;

  }

  return JSON.stringify(a).length >= JSON.stringify(b).length ? a : b;

}



// 合并同一张票: 场次按主客键并集合并

function mergeTicket(la, cb){

  var lm={}, cm={};

  (la.matches||[]).forEach(function(m){ lm[mKey(m)] = m; });

  (cb.matches||[]).forEach(function(m){

    if(lm[mKey(m)]){ lm[mKey(m)] = mergeMatch(lm[mKey(m)], m, tsOf(la), tsOf(cb)); }

    else { cm[mKey(m)] = m; }

  });

  var out = JSON.parse(JSON.stringify(la));

  out.matches = Object.keys(lm).map(function(k){return lm[k];}).concat(Object.keys(cm).map(function(k){return cm[k];}));

  if(tsOf(cb) > tsOf(out)) out.lastModified = cb.lastModified;

  return out;

}



// 合并两套数据: 票id并集 + 删除墓碑并集, 返回新 data 对象

function mergeData(local, cloud){

  var map={};

  (local.tickets||[]).forEach(function(t){ map[t.id] = t; });

  (cloud.tickets||[]).forEach(function(t){

    if(map[t.id]){ map[t.id] = mergeTicket(map[t.id], t); }

    else { map[t.id] = t; }

  });

  var deleted = [];

  (local.deletedIds||[]).forEach(function(d){ if(deleted.indexOf(d)<0) deleted.push(d); });

  (cloud.deletedIds||[]).forEach(function(d){ if(deleted.indexOf(d)<0) deleted.push(d); });

  var tickets = Object.keys(map).map(function(k){return map[k];})

    .filter(function(t){ return deleted.indexOf(t.id) < 0; })

    .sort(function(a,b){ return a.id - b.id; });

  return { capital: cloud.capital || local.capital || 500, tickets: tickets, deletedIds: deleted };

}



// 拉取云端后调用: 合并(不覆盖) + 回填 + 保存渲染; 返回合并统计

function applyMerged(cloud){

  if(!cloud || !Array.isArray(cloud.tickets)) return {changed:false, newIds:[], conflicts:[]};

  var before = JSON.stringify(data.tickets);

  var newIds=[], conflicts=[];

  (cloud.tickets||[]).forEach(function(ct){

    var lt = data.tickets.find(function(x){ return x.id === ct.id; });

    if(!lt) newIds.push(ct.id);

  });

  data = mergeData(data, cloud);

  data.capital = data.capital || 500;

  migrateHits(); migrateLeagues();

  (data.tickets||[]).forEach(function(t){

    (t.matches||[]).forEach(function(m){ if(m._conflict) conflicts.push('#'+t.id+' '+m.home+'-'+m.away+m._conflict); });

  });

  // 清除冲突标记, 避免持久化污染

  (data.tickets||[]).forEach(function(t){

    (t.matches||[]).forEach(function(m){ delete m._conflict; });

  });

  var changed = before !== JSON.stringify(data.tickets);

  save(); render();

  return {changed: changed, newIds: newIds, conflicts: conflicts};

}

// ===== 拆注串关规则 =====

// 组合数：每场选项数（单选1、双选2、三选3）的乘积；总组合 = 各场选项数乘积

// 本单金额 = 2元 × 倍数 × 组合数（例：2串1两场双选=2×2×2倍=16元）

function comboCount(t) {

  return t.matches.reduce(function(s, m) { return s * pickOpts(m).length; }, 1);

}

// 结算日 = 投注日 +1（竞彩开奖是次日）

function settlementDate(betDateStr) {

  var d = new Date(betDateStr + 'T00:00:00');

  d.setDate(d.getDate() + 1);

  var y = d.getFullYear(), mo = (d.getMonth()+1).toString().padStart(2,'0'), dd = d.getDate().toString().padStart(2,'0');

  return y + '-' + mo + '-' + dd;

}

function isDouble(m) { return !!(m.pick && m.pick.includes('或')); }

function pickOpts(m) { return isDouble(m) ? m.pick.split('或') : [m.pick]; }

// 赔率展示字符串：单选"1.85"，双选"1.85/3.20"，三选"1.85/3.20/4.50"

function oddsStr(m) {

  if (!isDouble(m)) return String(m.odds);

  var parts = [m.odds];

  if (m.odds2) parts.push(m.odds2);

  if (m.odds3) parts.push(m.odds3);

  return parts.join('/');

}

// 统一比分解析：支持 "3:3"、"3-3"、全角"３：３"，返回 胜/平/负；无法解析返回null

function parseScore(scoreStr) {

  if (!scoreStr) return null;

  var s = String(scoreStr).replace(/[：:]/g, '-').replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });

  var m = s.match(/^(\d+)\s*[-—–]\s*(\d+)$/);

  if (!m) return null;

  var h = parseInt(m[1], 10), a = parseInt(m[2], 10);

  if (isNaN(h) || isNaN(a)) return null;

  return h > a ? '胜' : h < a ? '负' : '平';

}

// 让球解析：先按让球数调整主队比分，再判胜平负。handicap=-1 主让一球, +1 主受一球

function parseScoreHC(scoreStr, handicap) {

  if (!scoreStr || !handicap) return parseScore(scoreStr);

  var s = String(scoreStr).replace(/[：:]/g, '-').replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });

  var m = s.match(/^(\d+)\s*[-—–]\s*(\d+)$/);

  if (!m) return null;

  var h = parseInt(m[1], 10) + parseInt(handicap, 10), a = parseInt(m[2], 10);

  if (isNaN(h) || isNaN(a)) return null;

  return h > a ? '胜' : h < a ? '负' : '平';

}

// 该场命中选项：让球场返回"让一球胜/平/负"(与pick格式一致)，普通场返回"胜/平/负"

var HC_CN = { '-5':'让五球','-4':'让四球','-3':'让三球','-2':'让两球','-1':'让一球','1':'受一球','2':'受两球','3':'受三球','4':'受四球','5':'受五球' };

function hcLabel(hc) { return HC_CN[String(hc)] || ('让' + hc + '球'); }

function hitOf(m) {

  var r = parseScoreHC(m.score, m.handicap);

  if (!r) return null;

  return m.handicap ? hcLabel(m.handicap) + r : r;

}

// 单选项赔率：第2项用odds2、第3项用odds3，历史数据缺失时用odds（兼容）

function optOdds(m, opt) {

  var opts = pickOpts(m);

  var idx = opts.indexOf(opt);

  if (idx === 1 && m.odds2) return m.odds2;

  if (idx === 2 && m.odds3) return m.odds3;

  return m.odds;

}

// 拆注：每场展开成 [{opt,odd}] 列表（单选1项，双选2项，三选3项），笛卡尔积生成全部组合注

// 历史兼容：复选场已标"中"但从未记录命中选项(hit)时，不拆注、取较低赔率保守结算（宁低勿高，与原逻辑一致）

function choicesOf(m) {

  var opts = pickOpts(m);

  if (opts.length === 1) return [{ opt: m.pick, odd: m.odds || 1 }];

  if (m.hit) {

    return opts.map(function(o) { return { opt: o, odd: optOdds(m, o) || m.odds || 1 }; });

  }

  if (m.result === 'win') {

    // 历史兼容：标中但无hit，取所有选项赔率中的较低者，不拆注

    var minOdd = Math.min.apply(null, opts.map(function(o) { return optOdds(m, o) || m.odds || 1; }));

    return [{ opt: opts[0], odd: minOdd }];

  }

  return opts.map(function(o) { return { opt: o, odd: optOdds(m, o) || m.odds || 1 }; });

}

function expandCombos(t) {

  var combos = [{ opts: [], oddsProd: 1 }];

  t.matches.forEach(function(m) {

    var choices = choicesOf(m);

    var next = [];

    combos.forEach(function(c) {

      choices.forEach(function(ch) {

        next.push({ opts: c.opts.concat([ch.opt]), oddsProd: c.oddsProd * ch.odd });

      });

    });

    combos = next;

  });

  return combos;

}

// 一注是否中奖：该注每场的选项必须命中（实际赛果hit命中，或历史兼容的"已标中"）

function comboWon(combo, t) {

  return combo.opts.every(function(opt, i) {

    var m = t.matches[i];

    if (m.result === 'lose') return false;

    if (m.hit) return m.hit === opt;

    return m.result === 'win'; // 历史兼容：标中但无hit

  });

}

// 拆注结算：返回 {pending, payout, wonCombos, combos}

// payout = 所有中奖注的派彩之和；每注派彩 = 该注赔率乘积 × 2元 × 倍数

function settleTicket(t) {

  var hasPending = t.matches.some(function(m) { return m.result === 'pending'; });

  var combos = expandCombos(t);

  if (hasPending) return { pending: true, payout: 0, wonCombos: [], combos: combos };

  var won = combos.filter(function(c) { return comboWon(c, t); });

  var payout = Math.round(won.reduce(function(s, c) { return s + c.oddsProd * 2 * t.multi; }, 0));

  return { pending: false, payout: payout, wonCombos: won, combos: combos };

}

function calcPayout(t, w) {

  var st = settleTicket(t);

  return st.pending ? 0 : st.payout;

}

// 待赛最高预计收益：已定hit的场用命中赔率，未定场取最高赔率（乐观上限）

function maxPayout(t) {

  var prod = 1;

  t.matches.forEach(function(m) {

    if (m.hit) { prod *= optOdds(m, m.hit); }

    else {

      var opts = pickOpts(m);

      var maxOdd = Math.max.apply(null, opts.map(function(o) { return optOdds(m, o) || m.odds; }));

      prod *= maxOdd;

    }

  });

  return Math.round(prod * 2 * t.multi);

}

// 赛果下拉选项HTML：双选场次把"✅中"拆成"✅中(命中选项)"，单选保持"✅中"

// 值格式：pending / lose / win:胜 / win:平 / win:负（win:xxx 同时记录命中选项hit）

function resultOptionsHtml(m) {

  var opts = pickOpts(m);

  var hit = m.hit || '';

  var html = '<option value="pending"'+(m.result==='pending'?' selected':'')+'>⏳待赛</option>';

  opts.forEach(function(o) {

    var sel = (m.result==='win' && (hit===o || (opts.length===1 && !hit))) ? ' selected' : '';

    html += '<option value="win:'+o+'"'+sel+'>✅中('+o+')</option>';

  });

  html += '<option value="lose"'+(m.result==='lose'?' selected':'')+'>❌错</option>';

  return html;

}

// 解析赛果下拉值：win:xxx → result=win + hit=xxx；win(兼容历史) → 单选命中=选项；lose → 未中

function parseResultValue(m, val) {

  if (val && val.indexOf('win:') === 0) { m.result='win'; m.hit=val.slice(4); }

  else if (val === 'win') { m.result='win'; m.hit=isDouble(m)?null:m.pick; }

  else if (val === 'lose') { m.result='lose'; m.hit=null; }

  else { m.result='pending'; }

}

// 数据迁移：为历史票回填命中选项hit（有比分用比分推算；单选"中"直接=选项），幂等

function migrateHits() {

  var changed = false;

  data.tickets.forEach(function(t) {

    t.matches.forEach(function(m) {

      if (m.hit) return;

      var r = hitOf(m);

      if (r) { m.hit = r; changed = true; }

      else if (m.result === 'win' && !isDouble(m)) {

        m.hit = m.pick; changed = true;

      }

    });

  });

  if (changed) save();

}

// 联赛名规范化：统一别名（韩职=K联赛，瑞超=瑞典超），幂等

var LEAGUE_ALIASES = { 'K联赛':'韩职', '瑞典超':'瑞超' };

function migrateLeagues() {

  var changed = false;

  data.tickets.forEach(function(t) {

    t.matches.forEach(function(m) {

      var lg = m.league || '其他';

      var target = LEAGUE_ALIASES[lg];

      if (target && m.league !== target) { m.league = target; changed = true; }

    });

  });

  if (changed) save();

}

    return fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', {

      body: JSON.stringify({ message: '📊 看板同步 '+new Date().toISOString().slice(0,10), content: b64, sha: existing ? existing.sha : undefined, branch: 'main' })

    });

  })

  .then(function(r) {

    if (r.ok) { alert('✅ 已上传'); return; }

    if (r.status === 409) {

      // SHA冲突：重新拉取合并再试一次

      return fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', { headers: {'Authorization': 'token '+token} })

      .then(function(r2) { return r2.json(); })

      .then(function(existing2) {

        var merged = data;

        if (existing2 && existing2.content) {

          try {

            var cloud = JSON.parse(decodeURIComponent(escape(atob(existing2.content))));

            if (cloud && Array.isArray(cloud.tickets)) merged = mergeData(data, cloud);

          } catch(e) {}

        }

        var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(merged, null, 2))));

        return fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json', {

          method: 'PUT', headers: {'Authorization': 'token '+token, 'Content-Type': 'application/json'},

          body: JSON.stringify({ message: '📊 看板同步 '+new Date().toISOString().slice(0,10), content: b64, sha: existing2.sha, branch: 'main' })

        });

      })

      .then(function(r3) { if(r3.ok) alert('✅ 已上传'); else return r3.text(); })

      .then(function(err3) { if(err3) alert('上传失败: ' + err3); });

    }

    return r.text();

  })

  .then(function(err) { if(err && err.indexOf('✅') < 0) alert('上传失败: ' + err); })

  .catch(function(e) { alert('❌ ' + e.message); if(e.message.indexOf('Token') >= 0) { setTimeout(syncToCloud, 500); } });

}



function analyze() {

  const tickets = data.tickets;

  let totalStake=0,totalPayout=0,wonTickets=0,winPicks=0,totalPicks=0;

  const leagues={},picks={},types={},series=[];

  let cum=0;

  tickets.forEach(t => {

    const st=settleTicket(t);

    const hp=st.pending;

    const pay=st.payout;

    totalStake+=t.stake; if(!hp)totalPayout+=pay;

    if(!hp&&pay>0)wonTickets++;

    if(!types[t.type])types[t.type]={n:0,w:0,stake:0,payout:0};

    types[t.type].n++; if(!hp&&pay>0)types[t.type].w++;

    types[t.type].stake+=t.stake; types[t.type].payout+=pay;

    t.matches.forEach(m => {

      totalPicks++; if(m.result==='win')winPicks++;

      const pk=m.pick.includes('或')?(m.pick.split('或').length===3?'三选':'双选'):m.pick;

      if(!picks[pk])picks[pk]={n:0,w:0,stake:0,payout:0};

      picks[pk].n++; if(m.result==='win')picks[pk].w++;

      picks[pk].stake+=t.stake/t.matches.length;

      if(!hp&&pay>0)picks[pk].payout+=pay/t.matches.length;

      const lg=m.league||'其他';

      if(!leagues[lg])leagues[lg]={n:0,w:0,stake:0,payout:0};

      leagues[lg].n++; if(m.result==='win')leagues[lg].w++;

      leagues[lg].stake+=t.stake/t.matches.length;

      if(!hp&&pay>0)leagues[lg].payout+=pay/t.matches.length;

    });

    if(!hp){cum+=pay-t.stake;series.push({label:'#'+t.id,cum:Math.round(cum*100)/100,date:t.date});}

  });

  const pnl=totalPayout-totalStake;

  const pending=tickets.filter(t=>t.matches.some(m=>m.result==='pending')).reduce((s,t)=>s+t.stake,0);

  // 计算今日盈亏

  var todayDate='',todayPnl=0;

  tickets.forEach(function(t){if(!t.matches.some(function(m){return m.result==='pending';})&&t.date>todayDate)todayDate=t.date;});

  if(todayDate){var tt=tickets.filter(function(t){return t.date===todayDate&&!t.matches.some(function(m){return m.result==='pending';});});var ts=0,tp=0;tt.forEach(function(t){ts+=t.stake;tp+=calcPayout(t,true);});todayPnl=tp-ts;}

  return{totalStake,totalPayout,pnl,wonTickets,totalTickets:tickets.length,winPicks,totalPicks,

    ticketRate:tickets.length?wonTickets/tickets.length:0,pickRate:totalPicks?winPicks/totalPicks:0,

    leagues,picks,types,series,pending,available:500+pnl,todayPnl:todayPnl};

}



function render() {

  const s=analyze();

  document.getElementById('cCapital').textContent=500;

  document.getElementById('cAvail').textContent=Math.round(s.available);

  const pel=document.getElementById('cPnl');

  pel.textContent=(s.pnl>=0?'+':'')+Math.round(s.pnl);

  pel.className='stat-value '+(s.pnl>=0?'win':'lose');

  // 今日战绩：按开奖日(投注日+1)计算——今天开奖的票才算今日战绩

  var todayDate = bjToday();

  var todayPnl = 0;

  var todayTickets = data.tickets.filter(function(t) { return settlementDate(t.date) === todayDate && !t.matches.some(function(m) { return m.result === 'pending'; }); });

  var todayStake = 0, todayPayout = 0;

  todayTickets.forEach(function(t) {

    todayStake += t.stake;

    todayPayout += calcPayout(t, true);

  });

  todayPnl = todayPayout - todayStake;

  var cToday = document.getElementById('cToday');

  if (cToday) {

    var dispDate = todayDate;

    cToday.innerHTML = (todayPnl >= 0 ? '+' : '') + Math.round(todayPnl);

    cToday.className = 'stat-value ' + (todayPnl >= 0 ? 'win' : 'lose');

  }

  var cEx = document.getElementById('cTodayExtra');

  if (cEx) {

    var pStr = '', pendingDate = '';

    if (s.pending > 0) {

      // 找最近待赛票的日期

      var pendingTickets = data.tickets.filter(function(t) { return t.matches.some(function(m) { return m.result === 'pending'; }); });

      pendingTickets.forEach(function(t) { if (t.date > pendingDate) pendingDate = t.date; });

      pStr = ' | 待赛' + s.pending + '元(' + settlementDate(pendingDate).slice(5) + '开奖)';

    }

    var noBetToday = todayTickets.length === 0;

    cEx.textContent = noBetToday ? (dispDate + ' 今日无开奖' + pStr) : (dispDate + ' 开奖结算' + pStr);

  }

  document.getElementById('cTicketRate').textContent=(s.ticketRate*100).toFixed(0)+'%';

  document.getElementById('cPickRate').textContent=(s.pickRate*100).toFixed(0)+'%';

  // 投注ROI：主=盈亏/总投入，小字=资金周转率+周期

  var roiData = calcROI(s.pnl, s.totalStake);

  var cRoi = document.getElementById('cROI');

  if (cRoi) {

    var cRoiEx = document.getElementById('cROIExtra');

    if (roiData.days <= 0 || s.totalStake <= 0) {

      cRoi.textContent = '—'; cRoi.className = 'stat-value neutral';

      cRoiEx.textContent = '暂无投注';

    } else {

      cRoi.textContent = (roiData.roi >= 0 ? '+' : '') + roiData.roi.toFixed(1) + '%';

      cRoi.className = 'stat-value ' + (roiData.roi >= 0 ? 'win' : 'lose');

      cRoiEx.textContent = '资金周转 ' + roiData.turnover.toFixed(2) + '次 · ' + roiData.days + '天';

    }

  }

  const loss=Math.abs(s.pnl);

  var rTxt=document.getElementById('recoveryText');if(rTxt)rTxt.textContent=loss>0?'已亏 '+Math.round(loss)+' 元':'已回本!';

  var rBar=document.getElementById('recoveryBar');if(rBar)rBar.style.width=Math.max(0,Math.min(100,(1-loss/500)*100))+'%';

  var rAvail=document.getElementById('recoveryAvail');if(rAvail)rAvail.textContent=Math.round(s.available);

  renderRecords(s); renderCharts(s); renderLatestBets(s); renderAnalysis(s); renderPlan(s);

  save();

}

function editTypeChanged(){

  var typeVal = document.getElementById('ed-type').value;

  var n = typeVal === '单场固定' ? 1 : typeVal === '比分2串1' ? 2 : parseInt(typeVal.split('x')[0]) || 2;

  var container = document.getElementById('ed-matches');

  var boxes = container.querySelectorAll('.match-box');

  var cur = boxes.length;

  // 同步数据数组

  var t = editingId != null ? data.tickets.find(function(x){ return x.id === editingId; }) : null;

  if (t) {

    while (t.matches.length < n) t.matches.push({ home:'', away:'', pick:'胜', odds:0, handicap:null, result:'pending', hit:null, score:'', league:'' });

    if (t.matches.length > n) t.matches = t.matches.slice(0, n);

  }

  if (n === cur) return;

  if (n < cur) {

    // 减少：删掉多余的表单

    for (var i = cur - 1; i >= n; i--) { boxes[i].remove(); }

  } else {

    var template = boxes[cur - 1] ? boxes[cur - 1].cloneNode(true) : null;

    for (var j = cur; j < n; j++) {

      if (template) {

        var clone = template.cloneNode(true);

        clone.querySelector('.ed-away').value = '';

        clone.querySelector('.ed-score').value = '';

        clone.querySelector('.ed-result').value = 'pending';

function saveEdit(tid){

  const t=data.tickets.find(x=>x.id===tid);if(!t)return;

  const boxes=document.querySelectorAll('#ed-matches .match-box');

  if(boxes.length!==t.matches.length){alert('场次数量不一致');return;}

  // 先读取并校验所有场次，全部通过后才写回数据（避免校验失败导致部分写入）

  const edits=[];let firstErr='';

  boxes.forEach((box,i)=>{

    if(firstErr)return;

    const cur=t.matches[i];

    const e={home:box.querySelector('.ed-home').value.trim()||cur.home,

      away:box.querySelector('.ed-away').value.trim()||cur.away,

      pick:box.querySelector('.ed-pick').value,

      handicap:(box.querySelector('.ed-handicap')&&box.querySelector('.ed-handicap').value)?parseInt(box.querySelector('.ed-handicap').value,10):(box.querySelector('.ed-pick').value.indexOf('让')===0?-1:null),

      odds:parseFloat(box.querySelector('.ed-odds').value)||cur.odds,

      odds2:null,odds3:null,league:LEAGUE_ALIASES[box.querySelector('.ed-league').value.trim()]||box.querySelector('.ed-league').value.trim()||'其他',

      score:box.querySelector('.ed-score').value.trim()};

    var o2=box.querySelector('.ed-odds2')?box.querySelector('.ed-odds2').value:'';

    e.odds2=o2?parseFloat(o2):null;

    var o3=box.querySelector('.ed-odds3')?box.querySelector('.ed-odds3').value:'';

    e.odds3=o3?parseFloat(o3):null;

    const nOpts=e.pick.includes('或')?e.pick.split('或').length:1;

    if(nOpts>=2&&!e.odds2){firstErr='第'+(i+1)+'场: 双选(含或)需要填两个赔率: 赔率1 + 赔率2';return;}

    if(nOpts>=3&&!e.odds3){firstErr='第'+(i+1)+'场: 三选(胜或平或负)需要填三个赔率: 赔率1 + 赔率2 + 赔率3';return;}

    const edResult=box.querySelector('.ed-result').value;

    parseResultValue(e, edResult);

    // 编辑表单比分自动识别：填了有效比分则自动推算命中选项与赛果（比分优先）

    var r=hitOf(e);

    if(r){e.hit=r;e.result=(e.pick===r||(isDouble(e)&&e.pick.split('或').includes(r))||(e.handicap&&e.pick.indexOf('让')===0&&(hcLabel(e.handicap)+r)===e.pick))?'win':'lose';}

    edits.push(e);

  });

  if(firstErr){alert(firstErr);return;}

  // 全部通过，写回

  t.date=document.getElementById('ed-date').value||t.date;

  t.type=document.getElementById('ed-type').value;

  t.multi=parseInt(document.getElementById('ed-multi').value)||1;

  t.stake=parseInt(document.getElementById('ed-stake').value)||(2*t.multi);

  edits.forEach((e,i)=>{const m=t.matches[i];Object.assign(m,e);});

  t.lastModified=new Date().toISOString();

  editingId=null;editingSnapshot=null;render();

  if(localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud,500);

}

function deleteTicket(tid){

  if(!confirm('确定删除 #'+tid+' 这张票？此操作不可撤销！'))return;

  data.tickets=data.tickets.filter(x=>x.id!==tid);

  if(!data.deletedIds) data.deletedIds=[];

  data.deletedIds.push(tid); // 删除墓碑: 防止合并时云端旧票复活

  if(editingId===tid)editingId=null;

  render();

  if(localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud,500);

}

}



function renderCharts(s) {

  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{x:{ticks:{color:'#64748b'}},y:{ticks:{color:'#64748b'}}}};

  if(charts.pnl)charts.pnl.destroy();

  // 按结算日(投注日+1)汇总盈亏；待赛票在其开奖日显示"等待结果"灰柱

  var dayMap = {}, dayMatches = {}, pendMap = {}, pendMatches = {};

  data.tickets.forEach(function(t) {

    var sd = settlementDate(t.date);

    var hp = t.matches.some(function(m) { return m.result === 'pending'; });

    if (hp) {

      if (!pendMap[sd]) { pendMap[sd] = 0; pendMatches[sd] = []; }

      pendMap[sd] += t.stake;

      pendMatches[sd].push('--- #' + t.id + ' ' + t.type + ' · 待赛' + t.stake + '元 · ' + t.date + '投 ---');

      t.matches.forEach(function(m) {

        pendMatches[sd].push('⏳ ' + m.home + ' vs ' + m.away + ' (猜' + (m.pick.includes('或')?(m.pick.split('或').length===3?'三选':'双选'):m.pick) + ')');

      });

      return;

    }

    var aw = t.matches.every(function(m) { return m.result === 'win'; });

    var pay = calcPayout(t, true);

    if (!dayMap[sd]) { dayMap[sd] = 0; dayMatches[sd] = []; }

    dayMap[sd] += pay - t.stake;

    dayMatches[sd].push('--- #' + t.id + ' ' + t.type + ' ---');

    t.matches.forEach(function(m) {

      var icon = m.result === 'win' ? '✅' : '❌';

      dayMatches[sd].push(icon + ' ' + m.home + ' vs ' + m.away + ' (猜' + (m.pick.includes('或')?(m.pick.split('或').length===3?'三选':'双选'):m.pick) + ')');

    });

  });

  var dates = Object.keys(dayMap).concat(Object.keys(pendMap));

  // 连续日期序列：从最早结算日到今天(BJT)及所有待赛开奖日

  if (dates.length > 0) {

    var firstDate = dates.slice().sort()[0], lastDate = bjToday();

    Object.keys(pendMap).forEach(function(d) { if (d > lastDate) lastDate = d; }); // 待赛开奖日在未来也要画

    if (lastDate < firstDate) lastDate = firstDate; // 数据异常保护

    var allDates = [], cur = new Date(firstDate + 'T00:00:00');

    var lastD = new Date(lastDate + 'T00:00:00');

    while (cur <= lastD) {

      var y = cur.getFullYear(), mo = (cur.getMonth()+1).toString().padStart(2,'0'), d = cur.getDate().toString().padStart(2,'0');

      allDates.push(y + '-' + mo + '-' + d);

      cur.setDate(cur.getDate() + 1);

    }

    dates = allDates;

  }

  // null = 无投注日（不画柱子）；0 = 真实平局（画灰色小柱）

  var dayData = dates.map(function(d) { return dayMap.hasOwnProperty(d) ? dayMap[d] : null; });

  var pendData = dates.map(function(d) { return pendMap.hasOwnProperty(d) ? pendMap[d] : null; });

  var dayLabels = dates.map(function(d) { return d.slice(5); });

  charts.pnl = new Chart(document.getElementById('pnlChart'), {

    type: 'bar',

    data: { labels: dayLabels, datasets: [

      { label: '逐日盈亏', data: dayData,

        backgroundColor: dayData.map(function(v) { return v === null ? 'transparent' : (v > 0 ? '#eab308' : v < 0 ? '#ff0000' : '#64748b'); }),

        borderWidth: 0, borderRadius: 4 },

      { label: '待赛', data: pendData, backgroundColor: '#64748b44', borderColor: '#64748b', borderWidth: 1, borderRadius: 4 }

    ]},

    options: {

      responsive: true, maintainAspectRatio: false, spanGaps: false,

      plugins: {

        legend: { display: false },

        title: { display: true, text: '📈 累计盈亏走势(逐日)', color: '#e2e8f0' },

        tooltip: {

          filter: function(item) { return item.raw !== null; }, // 无投注日不弹提示，避免误导

          callbacks: {

            title: function(items) { return items[0].label + (items[0].datasetIndex === 1 ? ' (开奖日)' : ' (结算日)'); },

            label: function(ctx) {

              var d = dates[ctx.dataIndex];

              var ms = ctx.datasetIndex === 1 ? pendMatches[d] : dayMatches[d];

              if (!ms || !ms.length) return '无投注';

              return ms;

            },

            afterLabel: function(ctx) {

              if (ctx.datasetIndex === 1) {

                var d = dates[ctx.dataIndex];

                return '待赛 ' + ctx.parsed.y + '元 · 开奖后结算';

              }

              var d = dates[ctx.dataIndex];

              if (!dayMatches[d] || !dayMatches[d].length) return '当天没有投注';

              return '盈亏: ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y + '元';

            }

          }

        },

        datalabels: {

          anchor: function(ctx) { return ctx.datasetIndex === 1 ? 'end' : (ctx.dataset.data[ctx.dataIndex] >= 0 ? 'end' : 'start'); },

          align: function(ctx) { return ctx.datasetIndex === 1 ? 'end' : (ctx.dataset.data[ctx.dataIndex] >= 0 ? 'end' : 'start'); },

          color: '#e2e8f0',

          font: { weight: 'bold', size: 11 },

          offset: 2,

          formatter: function(v, ctx) {

            if (v === null || v === 0) return '';

            if (ctx.datasetIndex === 1) return '⏳等待结果';

            return (v >= 0 ? '+' : '') + v + '元';

          }

        }

      },

      scales: {

        x: { ticks: { color: function(ctx) { return dayData[ctx.index] === null ? '#475569' : '#64748b'; } } },

        y: { grace: '30%', ticks: { color: '#64748b', callback: function(v) { return (v >= 0 ? '+' : '') + v; } } }

      }

    },

  });

  if(charts.league)charts.league.destroy();

  // 联赛盈亏排行：横向柱状图，每联赛一根柱，柱长=净盈亏，金=盈利红=亏损

  // 按盈亏从高到低排序，柱端标注金额，tooltip显示投入/命中/场次

  const ll=Object.keys(s.leagues).map(function(l){

    const lg=s.leagues[l];

    return {name:l,pnl:Math.round((lg.payout-lg.stake)*100)/100,stake:lg.stake,w:lg.w,n:lg.n,rate:lg.n?Math.round(lg.w/lg.n*100):0};

  }).sort(function(a,b){return b.pnl-a.pnl;});

  charts.league=new Chart(document.getElementById('leagueChart'),{

    type:'bar',

    data:{labels:ll.map(function(x){return x.name;}),datasets:[{

      label:'净盈亏',data:ll.map(function(x){return x.pnl;}),

      backgroundColor:ll.map(function(x){return x.pnl>=0?'#eab308':'#ff0000';}),

      borderWidth:0,borderRadius:4,barThickness:18

    }]},

    options:{

      responsive:true,maintainAspectRatio:false,indexAxis:'y',

      plugins:{

        legend:{display:false},

        title:{display:true,text:'🏆 联赛盈亏排行',color:'#e2e8f0'},

        tooltip:{

          callbacks:{

            label:function(ctx){

            }

          color:'#e2e8f0',font:{weight:'bold',size:12},

          anchor:function(ctx){return ctx.dataset.data[ctx.dataIndex]>=0?'end':'start';},

          align:function(ctx){return ctx.dataset.data[ctx.dataIndex]>=0?'end':'start';},

          formatter:function(v){return (v>=0?'+':'')+v;}

        }

      },

      scales:{

        x:{title:{display:true,text:'净盈亏（元）',color:'#64748b'},ticks:{color:'#64748b',callback:function(v){return (v>=0?'+':'')+v;}}},

        y:{ticks:{color:'#94a3b8',font:{size:13}}}

    },

    plugins: [ChartDataLabels]

  });

}

function renderPlan(s) {

  var vDays = Math.min(90, Math.max(1, Math.floor((new Date() - new Date('2026-07-21'))/86400000) + 1));

    {name:'验证期',time:'第1-3个月',cap:'500元',strategy:'小注试探，2串1为主',target:'命中率≥35%',status:'进行中',pct:vDays/90},

  var settled = data.tickets.filter(function(t){ return !t.matches.some(function(m){ return m.result==='pending'; }); })

  var gate1ok = n30 >= 30 && w30/n30 >= 0.35;

  var gate1txt = '串关命中率≥35% (30票滚动): ' + w30 + '/' + n30 + ' = ' + Math.round(w30/n30*100) + '%' + (n30<30 ? ' · 差' + (30-n30) + '票满窗' : '');

  // 门槛2: 累计盈亏转正（含待赛扣款口径）

  var gate2ok = s.pnl > 0;

  var gate2txt = '累计盈亏转正: ' + (s.pnl>=0?'+':'') + Math.round(s.pnl) + '元';

  var gate3ok = vDays >= 30;

  var gate3txt = '验证期满1个月: ' + vDays + '/30天';

  var gateAll = gate1ok && gate2ok && gate3ok;

  phases[1].status = gateAll ? '🔓 可解锁' : '🔒 未解锁';

  phases[1].gate = '<div class="mt-3 pt-3 border-t border-slate-700/50 text-xs space-y-1">' +

    '<div class="font-semibold text-slate-400 mb-1">🚧 加码门槛（3条同时满足）</div>' +

    '<div class="'+(gate1ok?'win':'text-red-400')+'">'+(gate1ok?'✅':'❌')+' '+gate1txt+'</div>' +

    '<div class="'+(gate2ok?'win':'text-red-400')+'">'+(gate2ok?'✅':'❌')+' '+gate2txt+'</div>' +

    '<div class="'+(gate3ok?'win':'text-red-400')+'">'+(gate3ok?'✅':'❌')+' '+gate3txt+'</div>' +

function pullFromCloud() {

  function applyCloud(cloud) {

    if (!cloud || !Array.isArray(cloud.tickets) || !cloud.tickets.length) { alert('云端数据为空'); return; }

    var res = applyMerged(cloud);

    var msg = '✅ 已从云端合并 ' + cloud.tickets.length + ' 张票';

    if (res.newIds.length) msg += '，新增 ' + res.newIds.length + ' 张(#' + res.newIds.join(',#') + ')';

    if (res.conflicts.length) msg += '\n⚠️ 冲突(本地为准):\n' + res.conflicts.join('\n');

    alert(msg);

  }

  // 通道1: api.github.com（墙内可通）

  fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json?t=' + Date.now(), { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' })

  .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

  .then(function(d) { applyCloud(JSON.parse(decodeURIComponent(escape(atob(d.content))))); })

  .catch(function() {

    // 通道2: raw.githubusercontent.com

    return fetch('https://raw.githubusercontent.com/7velo/football-dash/main/data.json?t=' + Date.now(), { cache: 'no-store' })

    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })

    .then(applyCloud)

    .catch(function(e2) { alert('拉取失败: ' + e2.message); });

  });

}

function syncHandicap(pickSel){

  // pick 切换为让球时, 若让球数未填则自动补 -1

  var p = pickSel.value;

  if (p.indexOf('让') === 0) {

    var box = pickSel.closest('.match-box') || pickSel.parentNode;

    var inp = box.querySelector('.mHandicap, .ed-handicap');

    if (inp && !inp.value) inp.value = '-1';

  }

function autoCalcStake() {

  var multi = parseInt(document.getElementById('fMul').value) || 1;

  // 组合数 = 各场选项数（单选1、双选2、三选3）乘积

  var combos = 1;

  document.querySelectorAll('.mPick').forEach(function(s) {

    var opts = s.value.split('或');

    combos *= opts.length;

  });

  var total = 2 * multi * combos;

  document.getElementById('fStake').value = total;

  var d = document.getElementById('fStakeDisplay');

  if (d) d.textContent = total + ' 元';

  var c = document.getElementById('fComboInfo');

  if (c) c.textContent = combos > 1 ? (combos + '种组合 × ' + multi + '倍 × 2元 = ' + total + '元' + (combos >= 4 ? '（含复选拆注）' : '')) : '单注 × ' + multi + '倍 × 2元 = ' + total + '元';

}



function addBet(){

  const date=document.getElementById('fDate').value;

  const type=document.getElementById('fType').value;

  const multi=parseInt(document.getElementById('fMul').value)||1;

  const divs=document.querySelectorAll('.match-box');

  if(!divs.length)return;

  const matches=[];let firstErr='';

  divs.forEach(d=>{

    const home=d.querySelector('.mHome').value.trim();

    const away=d.querySelector('.mAway').value.trim();

    const pick=d.querySelector('.mPick').value;

    const odds=parseFloat(d.querySelector('.mOdds').value);

    const odds2Raw=d.querySelector('.mOdds2')?d.querySelector('.mOdds2').value:'';

    const odds2=odds2Raw?parseFloat(odds2Raw):null;

    const odds3Raw=d.querySelector('.mOdds3')?d.querySelector('.mOdds3').value:'';

    const odds3=odds3Raw?parseFloat(odds3Raw):null;

    const league=d.querySelector('.mLeague').value.trim()||'其他';

    const hcRaw=d.querySelector('.mHandicap')?d.querySelector('.mHandicap').value:'';

    const handicap=hcRaw?parseInt(hcRaw,10):(pick.indexOf('让')===0?-1:null);

    if(firstErr)return;

    if(!home||!away||!odds){firstErr='请填完主队、客队、赔率';return;}

    const nOpts=pick.includes('或')?pick.split('或').length:1;

    if(nOpts>=2&&odds2===null){firstErr='双选(含或)需要填两个赔率: 赔率1 + 赔率2';return;}

    if(nOpts>=3&&odds3===null){firstErr='三选(胜或平或负)需要填三个赔率: 赔率1 + 赔率2 + 赔率3';return;}

    matches.push({home,away,pick,odds,odds2,odds3,handicap,result:'pending',hit:null,score:'',league:LEAGUE_ALIASES[league]||league});

  });

  if(firstErr){alert(firstErr);return;}

  const stake=parseInt(document.getElementById('fStake').value)||(2*multi);

  const newId=Math.max(...data.tickets.map(t=>t.id),0)+1;

  data.tickets.push({id:newId,date:date||new Date().toISOString().slice(0,10),type,multi,stake,matches,lastModified:new Date().toISOString()});

  render();

  alert('✅ 已添加 #'+newId);

  if(localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud,500);

}

// ===== 自动结算引擎 v1.1 (2026-08-17, 桌面版v8.5适配) =====

// 前端通过 corsproxy.io 桥接 fotmob API, 对带 matchId 的 pending 票自动拉比分并结算

// 复用桌面版引擎: parseScoreHC / hitOf / hcLabel / pickOpts(让球语义已内置)

var FOTMOB_PROXY = 'https://corsproxy.io/?url=';

function fotmobFetch(path, attempt) {

  attempt = attempt || 0;

  return fetch(FOTMOB_PROXY + encodeURIComponent('https://www.fotmob.com' + path), { mode: 'cors' })

    .then(function(r) { return r.ok ? r.json() : null; })

    .catch(function() {

      if (attempt < 2) {

        return new Promise(function(res) { setTimeout(res, 1500 * (attempt + 1)); })

          .then(function() { return fotmobFetch(path, attempt + 1); });

      }

      return null;

    });

}

// 从 fotmob matchDetails 提取常规时间比分: {h, a} 或 null

function fotmobScore(d) {

  if (!d || !d.header || !d.header.status) return null;

  if (!d.header.status.finished) return null; // 未完赛不结算

  var teams = d.header.teams;

  if (!teams || teams.length < 2) return null;

  var h = teams[0].score, a = teams[1].score;

  if (h == null || a == null) return null;

  return { h: h, a: a };

}

// 结算单场: 返回 {settled, score, result, hit} 或 null(未到结算时机/无matchId)

function settleOne(m) {

  if (m.result !== 'pending' || !m.matchId) return Promise.resolve(null);

  return fotmobFetch('/api/data/matchDetails?matchId=' + m.matchId)

    .then(function(d) {

      var sc = fotmobScore(d);

      if (!sc) return null;

      m.score = sc.h + '-' + sc.a;

      var hit = hitOf(m); // 复用桌面版: 让球票返回"让一球胜/平/负", 普通票返回"胜/平/负"

      if (!hit) return null;

      m.hit = hit;

      m.result = pickOpts(m).indexOf(hit) >= 0 ? 'win' : 'lose';

      return { settled: true, score: m.score, result: m.result, hit: m.hit };

    });

}

// 全表自动结算(静默/弹窗): 遍历 pending+matchId 场次, 串行结算

function autoSettleRun(showAlert) {

  var targets = [];

  data.tickets.forEach(function(t) {

    t.matches.forEach(function(m) {

      if (m.result === 'pending' && m.matchId) targets.push(m);

    });

  });

  if (!targets.length) {

    if (showAlert) alert('⚡ 无可自动结算的场次\n(需要票的场次带 matchId, 且为 pending)');

    return Promise.resolve(0);

  }

  var results = [];

  var chain = Promise.resolve();

  targets.forEach(function(m) {

    chain = chain.then(function() {

      return settleOne(m).then(function(r) {

        if (r) results.push(m.home + ' ' + r.score + ' → ' + (r.result === 'win' ? '✅中' : '❌错') + '(' + r.hit + ')');

      });

    });

  });

  return chain.then(function() {

    var settled = results.length;

    if (settled) {

      save();

      render();

      if (localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud, 500);

      if (showAlert) {

        alert('⚡ 自动结算完成 ' + settled + '/' + targets.length + ' 场:\n' + results.join('\n'));

      } else {

        console.log('[autoSettle]', results.join(' | '));

      }

    } else if (showAlert) {

      alert('⚡ 检查 ' + targets.length + ' 场, 均未完赛或未到结算时机');

    }

    return settled;

  });

}

function autoSettleAll() { return autoSettleRun(true); }
