<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞翔大魔王 · 竞彩看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
*{font-family:'Noto Sans SC',sans-serif}
body{background:#0f172a;color:#e2e8f0}
.card{background:#1e293b;border-radius:16px;border:1px solid #334155;padding:20px}
.stat-value{font-size:28px;font-weight:900}
.stat-label{font-size:13px;color:#94a3b8;margin-top:2px}
.win{color:#eab308}.lose{color:#ff0000}.neutral{color:#f59e0b}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.chip-win{background:#eab30822;color:#eab308;border:1px solid #eab30844}
.chip-lose{background:#ff000022;color:#ff0000;border:1px solid #ff000044}
.chip-pending{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b44}
.btn{padding:8px 20px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-primary{background:#3b82f6;color:white;border:none}
.btn-sm{padding:4px 12px;font-size:13px}
.input-field{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#e2e8f0;width:100%;outline:none}
.progress-bar{height:8px;border-radius:999px;background:#334155;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;transition:width .5s}
.tab-btn{padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid transparent;background:transparent;color:#94a3b8}
.tab-btn.active{background:#3b82f6;color:white}
.hidden{display:none}
.match-box{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:16px}
.ticket-group{background:#0f172a;border-radius:10px;overflow:hidden}
.ticket-row:not(:last-child){border-bottom:2px dashed #334155}
.ticket-header{background:#1e293b;padding:6px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="max-w-7xl mx-auto px-4 py-6">
<div class="flex items-center justify-between mb-6">
<div><h1 class="text-2xl font-black text-white">⚽ 竞彩投资看板</h1><p class="text-sm text-slate-400 mt-1">飞翔大魔王 · 验证期 · 三阶段计划 <span id="liveClock" style="color:#eab308;font-weight:600;margin-left:8px;font-family:monospace"></span></p></div>
<div class="flex gap-2">
<button onclick="fixGarbledData()" class="btn btn-sm" style="background:#f59e0b;color:black">🔧 修复乱码</button>
<button onclick="syncToCloud()" class="btn btn-sm" style="background:#eab308;color:white">☁️ 推云端</button>
<button onclick="pullFromCloud()" class="btn btn-sm" style="background:#3b82f6;color:white">📥 从云端拉</button>
<button onclick="exportData()" class="btn btn-sm" style="background:#334155;color:#94a3b8">📥 导出</button>
</div>
</div>
<div class="grid grid-cols-2 md:grid-cols-7 gap-4 mb-6">
<div class="card text-center"><div class="stat-label">💰 起始本金</div><div class="stat-value" style="color:#60a5fa" id="cCapital">500</div></div>
<div class="card text-center"><div class="stat-label">🟢 当前可用</div><div class="stat-value win" id="cAvail">0</div></div>
<div class="card text-center"><div class="stat-label">📊 累计盈亏</div><div class="stat-value" id="cPnl">0</div></div>
<div class="card text-center"><div class="stat-label">🔥 今日战绩</div><div class="stat-value" id="cToday">0</div><div id="cTodayExtra" style="font-size:10px;color:#64748b;margin-top:-4px"></div></div>
<div class="card text-center"><div class="stat-label">🎯 串关命中率</div><div class="stat-value neutral" id="cTicketRate">0%</div></div>
<div class="card text-center"><div class="stat-label">📋 单场命中率</div><div class="stat-value neutral" id="cPickRate">0%</div></div>
<div class="card text-center"><div class="stat-label">📊 投注ROI</div><div class="stat-value neutral" id="cROI">—</div><div id="cROIExtra" style="font-size:10px;color:#64748b;margin-top:-4px"></div></div>
</div>
<div class="card mb-6">
<div class="stat-label mb-3">📋 最新投注</div>
<div id="latestBets"></div>
</div>

<div class="flex gap-2 mb-4 flex-wrap">
<button class="tab-btn active" onclick="switchTab('dashboard',this)">📊 总览</button>
<button class="tab-btn" onclick="switchTab('records',this)">📋 记录</button>
<button class="tab-btn" onclick="switchTab('analysis',this)">🔍 分析</button>
<button class="tab-btn" onclick="switchTab('plan',this)">🎯 计划</button>
<button class="tab-btn" onclick="switchTab('add',this)">➕ 添加</button>
</div>
<div id="tab-dashboard" class="tab-content">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
<div class="card"><canvas id="pnlChart" height="400"></canvas></div>
<div class="card"><canvas id="typeChart" height="280"></canvas></div>
<div class="card lg:col-span-2"><canvas id="leagueChart" height="200"></canvas></div>
</div>
</div>
<div id="tab-records" class="tab-content hidden"><div class="card overflow-x-auto p-0" id="recordsContainer"></div></div>
<div id="tab-analysis" class="tab-content hidden">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
<div class="card"><canvas id="pickChart" height="240"></canvas></div>
<div class="card"><canvas id="pickPnlChart" height="240"></canvas></div>
<div class="card"><canvas id="trendChart" height="240"></canvas></div>
<div class="card"><div class="stat-label mb-3">💡 关键发现</div><div id="insights" class="space-y-3 text-sm"></div></div>
</div>
</div>
<div id="tab-plan" class="tab-content hidden">
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="card lg:col-span-2"><div class="stat-label mb-3">📅 三阶段计划</div><div id="phasePlan" class="space-y-4"></div></div>
<div class="card"><div class="stat-label mb-3">🎯 目标追踪</div><div id="goalTracking" class="space-y-4"></div></div>
</div>
</div>
<div id="tab-add" class="tab-content hidden">
<div class="card max-w-3xl"><div class="stat-label mb-4">➕ 添加新投注</div>
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
<div><label class="text-xs text-slate-400 block mb-1">日期</label><input class="input-field" id="fDate" type="date"></div>
<div><label class="text-xs text-slate-400 block mb-1">串关类型</label><select class="input-field" id="fType" onchange="rebuildMatchFields();setTimeout(autoCalcStake,100)"><option value="单场固定">单场固定</option><option value="2x1" selected>2x1</option><option value="3x1">3x1</option><option value="4x1">4x1</option><option value="5x1">5x1</option></select></div>
<div><label class="text-xs text-slate-400 block mb-1">倍数</label><input class="input-field" id="fMul" type="number" min="1" value="1" oninput="autoCalcStake()"></div>
<div><label class="text-xs text-slate-400 block mb-1">本单金额</label><div class="input-field" id="fStakeDisplay" style="display:flex;align-items:center;font-weight:700;color:#eab308">0 元</div><input type="hidden" id="fStake" value="0"><div id="fComboInfo" style="font-size:11px;color:#64748b;margin-top:4px;min-height:16px"></div></div>
</div>
<div id="matchFieldsContainer" class="space-y-3 mb-4"></div>
<div class="flex gap-3"><button onclick="addBet()" class="btn btn-primary">➕ 添加此单</button></div>
<div id="addMsg" class="mt-3 text-sm hidden"></div>
</div>
</div>
</div>

// 北京时间工具：返回当前北京日期 YYYY-MM-DD（Intl 指定 Asia/Shanghai，任何设备时区都正确）
function bjToday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
// 实时时钟：每秒刷新北京时间（Intl 指定 Asia/Shanghai，任何设备时区都正确）
function startLiveClock() {
  const el = document.getElementById('liveClock');
  if (!el) return;
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  function tick() {
    const parts = fmt.formatToParts(new Date());
    const get = t => (parts.find(p => p.type === t) || {}).value || '00';
    let h = get('hour'); if (h === '24') h = '00'; // 深夜 Intl 可能给 24，修正为 00
    el.textContent = '🕐 ' + get('year') + '-' + get('month') + '-' + get('day') + ' ' + h + ':' + get('minute') + ':' + get('second') + ' BJT';
  }
  tick();
  setInterval(tick, 1000);
}

// 投注ROI：roi=累计盈亏/总投入(竞彩标准:每投100元拿回多少)，turnover=资金周转率(总投入/本金)
function calcROI(pnl, totalStake) {
  const CAP = 500;
  const tickets = data.tickets;
  if (!tickets.length) return { roi: null, turnover: 0, days: 0 };
  const parseDate = s => { const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
  let firstDate = null;
  tickets.forEach(t => { const d = parseDate(t.date); if (!firstDate || d < firstDate) firstDate = d; });
  const today = parseDate(bjToday());
  const days = Math.max(1, Math.round((today - firstDate) / 86400000) + 1);
  const roi = totalStake > 0 ? (pnl / totalStake) * 100 : 0;
  const turnover = totalStake / CAP;
  return { roi, turnover, days };
}

// ===== 双选串关规则 =====
// 组合数：每场双选(含"或")计2种选项，总组合 = 各场选项数乘积
// 本单金额 = 2元 × 倍数 × 组合数（例：2串1两场双选=2×2×2倍=16元）
function comboCount(t) {
  return t.matches.reduce(function(s, m) { return s * (m.pick && m.pick.includes('或') ? 2 : 1); }, 1);
}
// 结算日 = 投注日 +1（竞彩开奖是次日）
function settlementDate(betDateStr) {
  var d = new Date(betDateStr + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  var y = d.getFullYear(), mo = (d.getMonth()+1).toString().padStart(2,'0'), dd = d.getDate().toString().padStart(2,'0');
  return y + '-' + mo + '-' + dd;
}
function isDouble(m) { return !!(m.pick && m.pick.includes('或')); }
// 双选场次的命中赔率：有实际命中选项(hit)用对应赔率；无hit保守取双选中较低赔率(宁低勿高)；历史数据无odds2时用odds
function pickOdds(m) {
  if (!isDouble(m)) return m.odds;
  var p1 = m.pick.split('或')[0], p2 = m.pick.split('或')[1];
  if (m.hit === p1) return m.odds;
  if (m.hit === p2 && m.odds2) return m.odds2;
  if (!m.odds2) return m.odds; // 历史数据兼容：只存了一个赔率
  return Math.min(m.odds, m.odds2);
}
function calcPayout(t, w) {
  if (!w) return 0;
  if (t.type === '单场固定') return Math.round(pickOdds(t.matches[0]) * 2 * t.multi);
  return Math.round(t.matches.reduce((s,m) => s * pickOdds(m), 1) * 2 * t.multi);
}
// 待赛最高预计收益：每个双选场次取较高赔率（乐观上限）
function maxPayout(t) {
  if (t.type === '单场固定') return Math.round((isDouble(t.matches[0]) && t.matches[0].odds2 ? Math.max(t.matches[0].odds, t.matches[0].odds2) : t.matches[0].odds) * 2 * t.multi);
  return Math.round(t.matches.reduce(function(s, m) {
    var o = isDouble(m) && m.odds2 ? Math.max(m.odds, m.odds2) : m.odds;
    return s * o;
  }, 1) * 2 * t.multi);
}

function analyze() {
  const tickets = data.tickets;
  let totalStake=0,totalPayout=0,wonTickets=0,winPicks=0,totalPicks=0;
  const leagues={},picks={},types={},series=[];
  let cum=0;
  tickets.forEach(t => {
    const hp=t.matches.some(m=>m.result==='pending');
    const aw=t.matches.every(m=>m.result==='win');
    const pay=hp?0:calcPayout(t,aw);
    totalStake+=t.stake; if(!hp)totalPayout+=pay;
    if(aw&&!hp)wonTickets++;
    if(!types[t.type])types[t.type]={n:0,w:0,stake:0,payout:0};
    types[t.type].n++; if(aw&&!hp)types[t.type].w++;
    types[t.type].stake+=t.stake; types[t.type].payout+=pay;
    t.matches.forEach(m => {
      totalPicks++; if(m.result==='win')winPicks++;
      const pk=m.pick.includes('或')?'双选':m.pick;
      if(!picks[pk])picks[pk]={n:0,w:0,stake:0,payout:0};
      picks[pk].n++; if(m.result==='win')picks[pk].w++;
      picks[pk].stake+=t.stake/t.matches.length;
      if(aw&&!hp)picks[pk].payout+=pay/t.matches.length;
      const lg=m.league||'其他';
      if(!leagues[lg])leagues[lg]={n:0,w:0,stake:0,payout:0};
      leagues[lg].n++; if(m.result==='win')leagues[lg].w++;
      leagues[lg].stake+=t.stake/t.matches.length;
      if(aw&&!hp)leagues[lg].payout+=pay/t.matches.length;
    });
    if(!hp){cum+=pay-t.stake;series.push({label:'#'+t.id,cum:Math.round(cum*100)/100,date:t.date});}
  });
  const pnl=totalPayout-totalStake;
  const pending=tickets.filter(t=>t.matches.some(m=>m.result==='pending')).reduce((s,t)=>s+t.stake,0);
  // 计算今日盈亏
  var todayDate='',todayPnl=0;
  tickets.forEach(function(t){if(!t.matches.some(function(m){return m.result==='pending';})&&t.date>todayDate)todayDate=t.date;});
  if(todayDate){var tt=tickets.filter(function(t){return t.date===todayDate&&!t.matches.some(function(m){return m.result==='pending';});});var ts=0,tp=0;tt.forEach(function(t){ts+=t.stake;if(t.matches.every(function(m){return m.result==='win';}))tp+=calcPayout(t,true);});todayPnl=tp-ts;}
  return{totalStake,totalPayout,pnl,wonTickets,totalTickets:tickets.length,winPicks,totalPicks,
    ticketRate:tickets.length?wonTickets/tickets.length:0,pickRate:totalPicks?winPicks/totalPicks:0,
    leagues,picks,types,series,pending,available:500+pnl,todayPnl:todayPnl};
}

  pel.className='stat-value '+(s.pnl>=0?'win':'lose');
  // 今日战绩：按开奖日(投注日+1)计算——今天开奖的票才算今日战绩
  var todayDate = bjToday();
  var todayPnl = 0;
  var todayTickets = data.tickets.filter(function(t) { return settlementDate(t.date) === todayDate && !t.matches.some(function(m) { return m.result === 'pending'; }); });
  var todayStake = 0, todayPayout = 0;
  todayTickets.forEach(function(t) {
    todayStake += t.stake;
    if (t.matches.every(function(m) { return m.result === 'win'; })) todayPayout += calcPayout(t, true);
  });
  todayPnl = todayPayout - todayStake;
  var cToday = document.getElementById('cToday');
  if (cToday) {
    var dispDate = todayDate;
    cToday.innerHTML = (todayPnl >= 0 ? '+' : '') + Math.round(todayPnl);
    cToday.className = 'stat-value ' + (todayPnl >= 0 ? 'win' : 'lose');
  }
  var cEx = document.getElementById('cTodayExtra');
  if (cEx) {
    var pStr = '', pendingDate = '';
    if (s.pending > 0) {
      // 找最近待赛票的日期
      var pendingTickets = data.tickets.filter(function(t) { return t.matches.some(function(m) { return m.result === 'pending'; }); });
      pendingTickets.forEach(function(t) { if (t.date > pendingDate) pendingDate = t.date; });
      pStr = ' | 待赛' + s.pending + '元(' + settlementDate(pendingDate).slice(5) + '开奖)';
    }
    var noBetToday = todayTickets.length === 0;
    cEx.textContent = noBetToday ? (dispDate + ' 今日无开奖' + pStr) : (dispDate + ' 开奖结算' + pStr);
  }
  document.getElementById('cTicketRate').textContent=(s.ticketRate*100).toFixed(0)+'%';
  document.getElementById('cPickRate').textContent=(s.pickRate*100).toFixed(0)+'%';
  // 投注ROI：主=盈亏/总投入，小字=资金周转率+周期
  var roiData = calcROI(s.pnl, s.totalStake);
  var cRoi = document.getElementById('cROI');
  if (cRoi) {
    var cRoiEx = document.getElementById('cROIExtra');
    if (roiData.days <= 0 || s.totalStake <= 0) {
      cRoi.textContent = '—'; cRoi.className = 'stat-value neutral';
      cRoiEx.textContent = '暂无投注';
    } else {
      cRoi.textContent = (roiData.roi >= 0 ? '+' : '') + roiData.roi.toFixed(1) + '%';
      cRoi.className = 'stat-value ' + (roiData.roi >= 0 ? 'win' : 'lose');
      cRoiEx.textContent = '资金周转 ' + roiData.turnover.toFixed(2) + '次 · ' + roiData.days + '天';
    }
  }
  const loss=Math.abs(s.pnl);
  var rTxt=document.getElementById('recoveryText');if(rTxt)rTxt.textContent=loss>0?'已亏 '+Math.round(loss)+' 元':'已回本!';
  var rBar=document.getElementById('recoveryBar');if(rBar)rBar.style.width=Math.max(0,Math.min(100,(1-loss/500)*100))+'%';
  var rAvail=document.getElementById('recoveryAvail');if(rAvail)rAvail.textContent=Math.round(s.available);
  renderRecords(s); renderCharts(s); renderLatestBets(s); renderAnalysis(s); renderPlan(s);
  save();
}

function editTicket(id){editingId=id;render();setTimeout(editStakeAuto,50);}
function cancelEdit(){editingId=null;render();}
function editTypeChanged(){
  // 根据新类型增减场次表单 + 同步扩展/截断 t.matches，保留已填数据
  var typeVal = document.getElementById('ed-type').value;
  var n = typeVal === '单场固定' ? 1 : typeVal === '比分2串1' ? 2 : parseInt(typeVal.split('x')[0]) || 2;
  var container = document.getElementById('ed-matches');
  var boxes = container.querySelectorAll('.match-box');
  var cur = boxes.length;
  // 同步数据数组
  var t = editingId != null ? data.tickets.find(function(x){ return x.id === editingId; }) : null;
  if (t) {
    while (t.matches.length < n) t.matches.push({ home:'', away:'', pick:'胜', odds:0, result:'pending', score:'', league:'' });
    if (t.matches.length > n) t.matches = t.matches.slice(0, n);
  }
  if (n === cur) return;
  if (n < cur) {
    // 减少：删掉多余的表单
    for (var i = cur - 1; i >= n; i--) { boxes[i].remove(); }
  } else {
    var template = boxes[cur - 1] ? boxes[cur - 1].cloneNode(true) : null;
    for (var j = cur; j < n; j++) {
      if (template) {
        var clone = template.cloneNode(true);
        clone.querySelector('.ed-home').value = '';
        clone.querySelector('.ed-away').value = '';
        clone.querySelector('.ed-score').value = '';
        clone.querySelector('.ed-result').value = 'pending';
        container.appendChild(clone);
      } else {
        // 兜底：生成一个空表单
        container.insertAdjacentHTML('beforeend',
          '<div class="match-box" style="border:1px solid #334155;border-radius:8px;padding:10px;margin-bottom:8px"><div class="grid grid-cols-2 md:grid-cols-4 gap-3">'+
          '<div><label class="text-xs text-slate-400 block mb-1">主队</label><input class="input-field ed-home"></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">客队</label><input class="input-field ed-away"></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">选项</label><select class="input-field ed-pick" onchange="editStakeAuto()"><option value="胜">胜</option><option value="平">平</option><option value="负">负</option><option value="胜或平">胜或平</option><option value="平或负">平或负</option><option value="胜或负">胜或负</option></select></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">赔率1</label><input class="input-field ed-odds" type="number" step="0.01" min="1" oninput="editStakeAuto()"></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">赔率2(双选)</label><input class="input-field ed-odds2" type="number" step="0.01" min="1" placeholder="双选才填" oninput="editStakeAuto()"></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">联赛</label><input class="input-field ed-league"></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">比分</label><input class="input-field ed-score" placeholder="如 2-1"></div>'+
          '<div><label class="text-xs text-slate-400 block mb-1">赛果</label><select class="input-field ed-result"><option value="pending" selected>⏳待赛</option><option value="win">✅中</option><option value="lose">❌错</option></select></div>'+
          '</div></div>');
      }
    }
  }
  editStakeAuto();
}
function editStakeAuto(){
  var m=parseInt(document.getElementById('ed-multi').value)||1;
  // 组合数 = 各场双选(或)的2种选项乘积
  var combos=1;
  document.querySelectorAll('#ed-matches .ed-pick').forEach(function(s){if(s.value.includes('或'))combos*=2;});
  var total=2*m*combos;
  document.getElementById('ed-stake').value=total;
  var c=document.getElementById('edComboInfo');
  if(c)c.textContent=combos>1?(combos+'种组合 × '+m+'倍 × 2元 = '+total+'元'):('单注 × '+m+'倍 × 2元 = '+total+'元');
}
function saveEdit(tid){
  const t=data.tickets.find(x=>x.id===tid);if(!t)return;
  t.date=document.getElementById('ed-date').value||t.date;
  t.type=document.getElementById('ed-type').value;
  t.multi=parseInt(document.getElementById('ed-multi').value)||1;
  t.stake=parseInt(document.getElementById('ed-stake').value)||(2*t.multi);
  const boxes=document.querySelectorAll('#ed-matches .match-box');
  if(boxes.length!==t.matches.length){alert('场次数量不一致');return;}
  boxes.forEach((box,i)=>{
    const m=t.matches[i];
    m.home=box.querySelector('.ed-home').value.trim()||m.home;
    m.away=box.querySelector('.ed-away').value.trim()||m.away;
    m.pick=box.querySelector('.ed-pick').value;
    m.odds=parseFloat(box.querySelector('.ed-odds').value)||m.odds;
    var o2=box.querySelector('.ed-odds2')?box.querySelector('.ed-odds2').value:'';
    m.odds2=o2?parseFloat(o2):null;
    if(m.pick.includes('或')&&!m.odds2){alert('双选(含或)需要填两个赔率: 赔率1 + 赔率2');return;}
    m.league=box.querySelector('.ed-league').value.trim()||'其他';
    m.score=box.querySelector('.ed-score').value.trim();
    m.result=box.querySelector('.ed-result').value;
  });
  editingId=null;render();
  if(localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud,500);
}
function deleteTicket(tid){
  if(!confirm('确定删除 #'+tid+' 这张票？此操作不可撤销！'))return;
  data.tickets=data.tickets.filter(x=>x.id!==tid);
  if(editingId===tid)editingId=null;
  render();
  if(localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud,500);
}

function updateResult(tid,midx,val){const t=data.tickets.find(x=>x.id===tid);if(t&&t.matches[midx]){t.matches[midx].result=val;render();}}
function updateScore(tid,midx,val){
  const t=data.tickets.find(x=>x.id===tid);if(!t||!t.matches[midx])return;
  t.matches[midx].score=val;
  if(val&&val.includes('-')){
    const p=val.split('-'),h=parseInt(p[0]),a=parseInt(p[1]);
    if(!isNaN(h)&&!isNaN(a)){const r=h>a?'胜':h<a?'负':'平';const m=t.matches[midx];m.hit=r;m.result=(m.pick===r||(isDouble(m)&&m.pick.split('或').includes(r)))?'win':'lose';}
  }
  render();
}

function renderCharts(s) {
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8'}}},scales:{x:{ticks:{color:'#64748b'}},y:{ticks:{color:'#64748b'}}}};
  if(charts.pnl)charts.pnl.destroy();
  // 按结算日(投注日+1)汇总盈亏；待赛票在其开奖日显示"等待结果"灰柱
  var dayMap = {}, dayMatches = {}, pendMap = {}, pendMatches = {};
  data.tickets.forEach(function(t) {
    var sd = settlementDate(t.date);
    var hp = t.matches.some(function(m) { return m.result === 'pending'; });
    if (hp) {
      if (!pendMap[sd]) { pendMap[sd] = 0; pendMatches[sd] = []; }
      pendMap[sd] += t.stake;
      pendMatches[sd].push('--- #' + t.id + ' ' + t.type + ' · 待赛' + t.stake + '元 · ' + t.date + '投 ---');
      t.matches.forEach(function(m) {
        pendMatches[sd].push('⏳ ' + m.home + ' vs ' + m.away + ' (猜' + (m.pick.includes('或')?'双选':m.pick) + ')');
      });
      return;
    }
    var aw = t.matches.every(function(m) { return m.result === 'win'; });
    var pay = calcPayout(t, aw);
    if (!dayMap[sd]) { dayMap[sd] = 0; dayMatches[sd] = []; }
    dayMap[sd] += pay - t.stake;
    dayMatches[sd].push('--- #' + t.id + ' ' + t.type + ' ---');
    t.matches.forEach(function(m) {
      var icon = m.result === 'win' ? '✅' : '❌';
      dayMatches[sd].push(icon + ' ' + m.home + ' vs ' + m.away + ' (猜' + (m.pick.includes('或')?'双选':m.pick) + ')');
    });
  });
  var dates = Object.keys(dayMap).concat(Object.keys(pendMap));
  // 连续日期序列：从最早结算日到今天(BJT)及所有待赛开奖日
  if (dates.length > 0) {
    var firstDate = dates.slice().sort()[0], lastDate = bjToday();
    Object.keys(pendMap).forEach(function(d) { if (d > lastDate) lastDate = d; }); // 待赛开奖日在未来也要画
    if (lastDate < firstDate) lastDate = firstDate; // 数据异常保护
    var allDates = [], cur = new Date(firstDate + 'T00:00:00');
    var lastD = new Date(lastDate + 'T00:00:00');
    while (cur <= lastD) {
      var y = cur.getFullYear(), mo = (cur.getMonth()+1).toString().padStart(2,'0'), d = cur.getDate().toString().padStart(2,'0');
      allDates.push(y + '-' + mo + '-' + d);
      cur.setDate(cur.getDate() + 1);
    }
    dates = allDates;
  }
  // null = 无投注日（不画柱子）；0 = 真实平局（画灰色小柱）
  var dayData = dates.map(function(d) { return dayMap.hasOwnProperty(d) ? dayMap[d] : null; });
  var pendData = dates.map(function(d) { return pendMap.hasOwnProperty(d) ? pendMap[d] : null; });
  var dayLabels = dates.map(function(d) { return d.slice(5); });
  charts.pnl = new Chart(document.getElementById('pnlChart'), {
    type: 'bar',
    data: { labels: dayLabels, datasets: [
      { label: '逐日盈亏', data: dayData,
        backgroundColor: dayData.map(function(v) { return v === null ? 'transparent' : (v > 0 ? '#eab308' : v < 0 ? '#ff0000' : '#64748b'); }),
        borderWidth: 0, borderRadius: 4 },
      { label: '待赛', data: pendData, backgroundColor: '#64748b44', borderColor: '#64748b', borderWidth: 1, borderRadius: 4 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false, spanGaps: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: function(item) { return item.raw !== null; }, // 无投注日不弹提示，避免误导
          callbacks: {
            title: function(items) { return items[0].label + (items[0].datasetIndex === 1 ? ' (开奖日)' : ' (结算日)'); },
            label: function(ctx) {
              var d = dates[ctx.dataIndex];
              var ms = ctx.datasetIndex === 1 ? pendMatches[d] : dayMatches[d];
              if (!ms || !ms.length) return '无投注';
              return ms;
            },
            afterLabel: function(ctx) {
              if (ctx.datasetIndex === 1) {
                var d = dates[ctx.dataIndex];
                return '待赛 ' + ctx.parsed.y + '元 · 开奖后结算';
              }
              var d = dates[ctx.dataIndex];
              if (!dayMatches[d] || !dayMatches[d].length) return '当天没有投注';
              return '盈亏: ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y + '元';
            }
          }
        },
        datalabels: {
          anchor: function(ctx) { return ctx.datasetIndex === 1 ? 'end' : (ctx.dataset.data[ctx.dataIndex] >= 0 ? 'end' : 'start'); },
          align: function(ctx) { return ctx.datasetIndex === 1 ? 'end' : (ctx.dataset.data[ctx.dataIndex] >= 0 ? 'end' : 'start'); },
          color: '#e2e8f0',
          font: { weight: 'bold', size: 11 },
          offset: 2,
          formatter: function(v, ctx) {
            if (v === null || v === 0) return '';
            if (ctx.datasetIndex === 1) return '⏳等待结果';
            return (v >= 0 ? '+' : '') + v + '元';
          }
        }
      },
      scales: {
        x: { ticks: { color: function(ctx) { return dayData[ctx.index] === null ? '#475569' : '#64748b'; } } },
        y: { grace: '30%', ticks: { color: '#64748b', callback: function(v) { return (v >= 0 ? '+' : '') + v; } } }
      }
    },
    plugins: [ChartDataLabels]
  });
  if(charts.type)charts.type.destroy();
  const tl=Object.keys(s.types);
  charts.type=new Chart(document.getElementById('typeChart'),{type:'bar',data:{labels:tl,datasets:[{label:'中',data:tl.map(t=>s.types[t].w),backgroundColor:'#eab308',borderRadius:4},{label:'未中',data:tl.map(t=>s.types[t].n-s.types[t].w),backgroundColor:'#ff0000',borderRadius:4}]},options:{...opts,plugins:{...opts.plugins,title:{display:true,text:'📊 投注方式 (中/未中)',color:'#e2e8f0'}},scales:{x:{stacked:true},y:{stacked:true}}}});
  if(charts.league)charts.league.destroy();
  const ll=Object.keys(s.leagues),lp=ll.map(l=>Math.round((s.leagues[l].payout-s.leagues[l].stake)*100)/100);
  charts.league=new Chart(document.getElementById('leagueChart'),{type:'bar',data:{labels:ll,datasets:[{label:'净盈亏',data:lp,backgroundColor:lp.map(v=>v>=0?'#eab308':'#ff0000'),borderWidth:0,borderRadius:4}]},options:{...opts,plugins:{...opts.plugins,title:{display:true,text:'🏆 联赛盈亏 (按金额)',color:'#e2e8f0'},legend:{display:false}},indexAxis:'y'}});
}

function renderAnalysis(s) {
  if(charts.pick)charts.pick.destroy();
  const pl=Object.keys(s.picks);
  charts.pick=new Chart(document.getElementById('pickChart'),{type:'doughnut',data:{labels:pl.map(p=>p+' ('+s.picks[p].n+'次)'),datasets:[{data:pl.map(p=>s.picks[p].n),backgroundColor:['#3b82f6','#f59e0b','#ff0000','#8b5cf6','#ec4899','#14b8a6'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8'}},title:{display:true,text:'🎯 选项分布',color:'#e2e8f0'}}}});
  if(charts.pickPnl)charts.pickPnl.destroy();
  const pp=pl.map(p=>Math.round((s.picks[p].payout-s.picks[p].stake)*100)/100);
  charts.pickPnl=new Chart(document.getElementById('pickPnlChart'),{type:'bar',data:{labels:pl,datasets:[{label:'盈亏',data:pp,backgroundColor:pp.map(v=>v>=0?'#eab30888':'#ff000088'),borderColor:pp.map(v=>v>=0?'#eab308':'#ff0000'),borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'💰 选项盈亏',color:'#e2e8f0'}},scales:{y:{ticks:{color:'#64748b'}},x:{ticks:{color:'#94a3b8'}}}}});
  if(charts.trend)charts.trend.destroy();
  const tw=5,tr=[],ttl=[];
  data.tickets.forEach((t,i)=>{const st=Math.max(0,i-tw+1);tr.push(Math.round(data.tickets.slice(st,i+1).filter(x=>x.matches.every(m=>m.result==='win')).length/(i-st+1)*100));ttl.push('#'+t.id);});
  charts.trend=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:ttl,datasets:[{label:'近5票命中率',data:tr,borderColor:'#f59e0b',backgroundColor:'#f59e0b22',fill:true,tension:0.3,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8'}},title:{display:true,text:'📈 滚动命中率',color:'#e2e8f0'}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}},x:{ticks:{color:'#64748b'}}}}});
  const allM=data.tickets.flatMap(t=>t.matches);
  const flatB=allM.filter(m=>m.pick==='平'),flatR=flatB.length?Math.round(flatB.filter(m=>m.result==='win').length/flatB.length*100):0;
  const dub=allM.filter(m=>m.pick.includes('或')),dubR=dub.length?Math.round(dub.filter(m=>m.result==='win').length/dub.length*100):0;
  let bestL='',bestV=-999;
  Object.keys(s.leagues).forEach(l=>{const v=s.leagues[l].payout-s.leagues[l].stake;if(v>bestV&&s.leagues[l].n>=2){bestV=v;bestL=l;}});
  document.getElementById('insights').innerHTML=[
    {i:'🤔',t:'选平'+flatB.length+'次中'+flatB.filter(m=>m.result==='win').length+'次',d:'平局命中率 '+flatR+'%'},
    {i:'💡',t:'双选'+dub.length+'次中'+dub.filter(m=>m.result==='win').length+'次',d:'双选命中率 '+dubR+'%'},
    {i:'🏆',t:bestL?'最佳联赛: '+bestL:'数据不足',d:bestL?'盈亏 '+Math.round(bestV)+' 元':''},
    {i:'📉',t:'串关 '+s.wonTickets+'/'+s.totalTickets+' 中',d:'命中率 '+(s.ticketRate*100).toFixed(0)+'%'},
    {i:'🔥',t:'今日战绩',d:(s.todayPnl>=0?'+':'')+Math.round(s.todayPnl)+' 元'}
  ].map(x=>'<div class="flex gap-3 items-start p-3 bg-slate-800/50 rounded-lg"><span class="text-lg">'+x.i+'</span><div><div class="font-semibold text-sm">'+x.t+'</div><div class="text-xs text-slate-400">'+x.d+'</div></div></div>').join('');
}

function renderPlan(s) {
  // 验证期进度 = 实际日历天数/90天（2026-07-21启动），随投注进行自动推进
  var vDays = Math.min(90, Math.max(1, Math.floor((new Date() - new Date('2026-07-21'))/86400000) + 1));
  const phases=[
    {name:'验证期',time:'第1-3个月',cap:'500元',strategy:'小注试探，2串1为主',target:'命中率≥35%',status:'进行中',pct:vDays/90},
    {name:'加码期',time:'第4-6个月',cap:'2000-3000元',strategy:'验证通过后加码',target:'月收益率≥8%',status:'🔒',pct:0},
    {name:'扩张期',time:'第7-12个月',cap:'每月+1000元',strategy:'持续追加',target:'年收入10万+',status:'🔒',pct:0}
  ];
  if(s.ticketRate>=0.35)phases[1].status='🔓 可解锁';
  document.getElementById('phasePlan').innerHTML=phases.map(p=>'<div class="p-4 bg-slate-800/50 rounded-xl border '+(p.status.includes('行中')?'border-blue-500/30':'border-slate-700/50')+'"><div class="flex justify-between items-center mb-2"><span class="font-bold text-lg">'+p.name+'</span><span class="chip '+(p.status.includes('行中')||p.status.includes('解锁')?'chip-win':'chip-lose')+'">'+p.status+'</span></div><div class="grid grid-cols-2 gap-2 text-sm"><div><span class="text-slate-400">时间:</span> '+p.time+'</div><div><span class="text-slate-400">本金:</span> '+p.cap+'</div><div><span class="text-slate-400">策略:</span> '+p.strategy+'</div><div><span class="text-slate-400">目标:</span> '+p.target+'</div></div>'+(p.pct>0?'<div class="progress-bar mt-3"><div class="progress-fill" style="width:'+(p.pct*100)+'%;background:#3b82f6"></div></div><div class="text-xs text-slate-500 mt-1">进度 '+(p.pct*100).toFixed(0)+'%</div>':'')+'</div>').join('');
  document.getElementById('goalTracking').innerHTML=
    '<div class="p-3 bg-slate-800/50 rounded-lg"><div class="text-sm font-semibold">串关命中率</div><div class="text-2xl font-black mt-1 '+(s.ticketRate>=0.35?'win':'neutral')+'">'+s.wonTickets+'/'+s.totalTickets+'</div><div class="text-xs text-slate-400 mt-1">命中率 '+(s.ticketRate*100).toFixed(0)+'% · 目标 35%</div><div class="progress-bar mt-2"><div class="progress-fill" style="width:'+Math.min(100,s.ticketRate/0.35*100)+'%;background:'+(s.ticketRate>=0.35?'#eab308':'#f59e0b')+'"></div></div></div>'+
    '<div class="p-3 bg-slate-800/50 rounded-lg"><div class="text-sm font-semibold">单场命中率</div><div class="text-2xl font-black mt-1 '+(s.pickRate>=0.4?'win':'neutral')+'">'+s.winPicks+'/'+s.totalPicks+'</div><div class="text-xs text-slate-400 mt-1">命中率 '+(s.pickRate*100).toFixed(0)+'% · 目标 40%</div><div class="progress-bar mt-2"><div class="progress-fill" style="width:'+Math.min(100,s.pickRate/0.4*100)+'%;background:'+(s.pickRate>=0.4?'#eab308':'#f59e0b')+'"></div></div></div>'+
    '<div class="p-3 bg-slate-800/50 rounded-lg"><div class="text-sm font-semibold">当前可用</div><div class="text-2xl font-black mt-1 win">'+Math.round(s.available)+' 元</div><div class="text-xs text-slate-400 mt-1">本金 500 元 · 累计 '+Math.round(Math.abs(s.pnl))+' 元'+(s.pending>0?' · 待赛 '+s.pending+' 元':'')+'</div></div>'+
    '<div class="p-3 bg-slate-800/50 rounded-lg"><div class="text-sm font-semibold">验证期进度</div><div class="text-2xl font-black mt-1 text-blue-400">' + Math.min(90, Math.max(1, Math.floor((new Date() - new Date('2026-07-21'))/86400000) + 1)) + '天 / 90天</div><div class="progress-bar mt-2"><div class="progress-fill" style="width:' + (Math.min(90, Math.max(1, Math.floor((new Date() - new Date('2026-07-21'))/86400000) + 1)) / 90 * 100) + '%;background:#3b82f6"></div></div></div>';
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  if(btn)btn.classList.add('active');
  setTimeout(()=>Object.values(charts).forEach(c=>c?.resize()),100);
}


function pullFromCloud() {
  function applyCloud(cloud) {
    if (!cloud || !Array.isArray(cloud.tickets) || !cloud.tickets.length) { alert('云端数据为空'); return; }
    data.tickets = cloud.tickets;
    data.capital = cloud.capital || 500;
    localStorage.setItem('fb_dashboard_v2', JSON.stringify(data));
    alert('✅ 已从云端拉取 ' + cloud.tickets.length + ' 张票');
    render();
  }
  // 通道1: api.github.com（墙内可通）
  fetch('https://api.github.com/repos/7velo/football-dash/contents/data.json?t=' + Date.now(), { headers: { 'Accept': 'application/vnd.github+json' }, cache: 'no-store' })
  .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(d) { applyCloud(JSON.parse(decodeURIComponent(escape(atob(d.content))))); })
  .catch(function() {
    // 通道2: raw.githubusercontent.com
    return fetch('https://raw.githubusercontent.com/7velo/football-dash/main/data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(applyCloud)
    .catch(function(e2) { alert('拉取失败: ' + e2.message); });
  });
}

function exportData(){
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='竞彩数据_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

function rebuildMatchFields(){
  const type=document.getElementById('fType').value;
  const count=type==='单场固定'?1:type==='2x1'?2:type==='3x1'?3:type==='4x1'?4:5;
  const c=document.getElementById('matchFieldsContainer');c.innerHTML='';
  for(let i=1;i<=count;i++){
    const d=document.createElement('div');d.className='match-box';
    d.innerHTML='<h4 style="color:#60a5fa;font-weight:600;font-size:14px;margin-bottom:10px">⚽ 第 '+i+' 场</h4><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div><label class="text-xs text-slate-400 block mb-1">主队</label><input class="input-field mHome"></div><div><label class="text-xs text-slate-400 block mb-1">客队</label><input class="input-field mAway"></div><div><label class="text-xs text-slate-400 block mb-1">选项</label><select class="input-field mPick" onchange="autoCalcStake()"><option value="胜">胜</option><option value="平">平</option><option value="负">负</option><option value="胜或平">胜或平</option><option value="平或负">平或负</option><option value="胜或负">胜或负</option></select></div><div><label class="text-xs text-slate-400 block mb-1">赔率1</label><input class="input-field mOdds" type="number" step="0.01" min="1" placeholder="2.85" oninput="autoCalcStake()"></div><div><label class="text-xs text-slate-400 block mb-1">赔率2(双选)</label><input class="input-field mOdds2" type="number" step="0.01" min="1" placeholder="双选才填" oninput="autoCalcStake()"></div><div><label class="text-xs text-slate-400 block mb-1">联赛</label><input class="input-field mLeague" placeholder="挪超"></div></div>';
    c.appendChild(d);
  }
}


function autoCalcStake() {
  var multi = parseInt(document.getElementById('fMul').value) || 1;
  // 组合数 = 各场双选(或)的2种选项乘积
  var combos = 1;
  document.querySelectorAll('.mPick').forEach(function(s) { if (s.value.includes('或')) combos *= 2; });
  var total = 2 * multi * combos;
  document.getElementById('fStake').value = total;
  var d = document.getElementById('fStakeDisplay');
  if (d) d.textContent = total + ' 元';
  var c = document.getElementById('fComboInfo');
  if (c) c.textContent = combos > 1 ? (combos + '种组合 × ' + multi + '倍 × 2元 = ' + total + '元' + (combos >= 4 ? '（含双选拆注）' : '')) : '单注 × ' + multi + '倍 × 2元 = ' + total + '元';
}

function addBet(){
  const date=document.getElementById('fDate').value;
  const type=document.getElementById('fType').value;
  const multi=parseInt(document.getElementById('fMul').value)||1;
  const divs=document.querySelectorAll('.match-box');
  if(!divs.length)return;
  const matches=[];let ok=true;
  divs.forEach(d=>{
    const home=d.querySelector('.mHome').value.trim();
    const away=d.querySelector('.mAway').value.trim();
    const pick=d.querySelector('.mPick').value;
    const odds=parseFloat(d.querySelector('.mOdds').value);
    const odds2Raw=d.querySelector('.mOdds2')?d.querySelector('.mOdds2').value:'';
    const odds2=odds2Raw?parseFloat(odds2Raw):null;
    const league=d.querySelector('.mLeague').value.trim()||'其他';
    if(!home||!away||!odds){ok=false;return;}
    if(pick.includes('或')&&odds2===null){alert('双选(含或)需要填两个赔率: 赔率1 + 赔率2');ok=false;return;}
    matches.push({home,away,pick,odds,odds2,result:'pending',score:'',league});
  });
  if(!ok){alert('请填完主队、客队、赔率');return;}
  const stake=parseInt(document.getElementById('fStake').value)||(2*multi);
  const newId=Math.max(...data.tickets.map(t=>t.id),0)+1;
  data.tickets.push({id:newId,date:date||new Date().toISOString().slice(0,10),type,multi,stake,matches});
  render();
  alert('✅ 已添加 #'+newId);
  if(localStorage.getItem('gh_sync_token')) setTimeout(syncToCloud,500);
}

data=loadData();
data.capital=500;
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
  rebuildMatchFields();autoCalcStake();
  render();
  autoSyncFromCloud();
  startLiveClock();
});
</script>
